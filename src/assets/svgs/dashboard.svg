  <!-- Export btn -->
  <rect x="332" y="272" width="112" height="26" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="388" y="289" font-family="Georgia,serif" font-size="9" fill="#f59e0b" text-anchor="middle">↓ Exportar Relatório</text>
