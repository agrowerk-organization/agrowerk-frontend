    <line x1="40" y1="178" x2="298" y2="178"/>
    <line x1="40" y1="198" x2="298" y2="198"/>
    <line x1="40" y1="218" x2="298" y2="218"/>
    <line x1="40" y1="238" x2="298" y2="238"/>
    <line x1="40" y1="268" x2="298" y2="268"/>
  </g>
