  <rect x="244" y="40" width="102" height="68" rx="10" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1"/>
  <text x="254" y="60" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Produtividade</text>
  <text x="254" y="84" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#e5e7eb">62 sc/ha</text>
  <text x="254" y="98" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">média</text>
  <text x="336" y="60" font-family="Georgia,serif" font-size="10" fill="#4ade80" text-anchor="end">↑5%</text>

