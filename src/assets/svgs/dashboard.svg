  <rect x="24" y="40" width="102" height="68" rx="10" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1"/>
  <text x="34" y="60" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Produção Total</text>
  <text x="34" y="84" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#4ade80">4.820</text>
  <text x="34" y="98" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">sacas</text>
  <text x="116" y="60" font-family="Georgia,serif" font-size="10" fill="#4ade80" text-anchor="end">↑12%</text>

  <!-- KPI 2 -->
  <rect x="134" y="40" width="102" height="68" rx="10" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1"/>
  <text x="144" y="60" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Receita Bruta</text>
  <text x="144" y="84" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#f59e0b">R$723k</text>
