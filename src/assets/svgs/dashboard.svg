  <rect x="368" y="14" width="88" height="22" rx="11" fill="#0a1e12" stroke="#4ade80" stroke-width="1"/>
  <circle cx="382" cy="25" r="4" fill="#4ade80" filter="url(#gg)"/>
  <text x="420" y="29" font-family="Georgia,serif" font-size="9" fill="#4ade80" text-anchor="middle">Ao vivo</text>

