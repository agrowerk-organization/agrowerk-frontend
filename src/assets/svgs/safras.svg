  <text x="50" y="208" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Plantio</text>
  <rect x="95" y="198" width="12" height="10" rx="2" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
  <text x="113" y="208" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Colheita</text>
  <circle cx="163" cy="203" r="6" fill="#f59e0b" fill-opacity="0.9"/>
  <text x="176" y="208" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Hoje</text>

