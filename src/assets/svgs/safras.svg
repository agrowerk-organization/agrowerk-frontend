  <rect x="260" y="24" width="196" height="210" rx="14" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <rect x="260" y="24" width="196" height="4" rx="2" fill="url(#obtn)"/>
  <text x="358" y="54" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">Etapas da Safra</text>

  <!-- Stage 1 -->
  <circle cx="284" cy="84" r="16" fill="#0a1e12" stroke="#4ade80" stroke-width="1.5" filter="url(#gg)"/>
  <ellipse cx="284" cy="84" rx="7" ry="9" fill="#4ade80" opacity="0.4"/>
  <ellipse cx="284" cy="82" rx="4" ry="5" fill="#4ade80"/>
  <text x="308" y="80" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#e5e7eb">Semeadura</text>
  <text x="308" y="92" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Mar 7–8</text>
  <line x1="284" y1="100" x2="284" y2="114" stroke="#2d5a3d" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stage 2 -->
  <circle cx="284" cy="128" r="16" fill="#0a1e12" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="284" y1="138" x2="284" y2="120" stroke="#4ade80" stroke-width="2"/>
  <path d="M284 126 Q278 120 276 116" stroke="#4ade80" stroke-width="1.5" fill="none"/>
  <path d="M284 128 Q290 122 292 118" stroke="#4ade80" stroke-width="1.5" fill="none"/>
  <text x="308" y="124" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#e5e7eb">Crescimento</text>
  <text x="308" y="136" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Mar 11 – Abr</text>
  <line x1="284" y1="144" x2="284" y2="158" stroke="#2d5a3d" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stage 3 -->
  <circle cx="284" cy="172" r="16" fill="#0a1e12" stroke="#f59e0b" stroke-width="1.5" filter="url(#og)"/>
  <line x1="284" y1="182" x2="284" y2="164" stroke="#f59e0b" stroke-width="2"/>
  <ellipse cx="280" cy="167" rx="4" ry="5" fill="#f59e0b" opacity="0.6" transform="rotate(-20 280 167)"/>
  <ellipse cx="288" cy="167" rx="4" ry="5" fill="#f59e0b" opacity="0.6" transform="rotate(20 288 167)"/>
  <ellipse cx="284" cy="163" rx="4" ry="5" fill="#f59e0b"/>
  <text x="308" y="168" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#e5e7eb">Colheita</text>
  <text x="308" y="180" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Mar 23–24</text>

  <!-- Alert card bottom -->
  <rect x="24" y="248" width="432" height="84" rx="14" fill="url(#card)" filter="url(#cs)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="24" y="248" width="5" height="84" rx="3" fill="#f59e0b"/>
  <circle cx="58" cy="290" r="20" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="58" y="296" font-family="Georgia,serif" font-size="18" text-anchor="middle">⚠</text>
  <text x="92" y="270" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#f59e0b">Alerta Climático — Fazenda Bela Vista</text>
  <text x="92" y="286" font-family="Georgia,serif" font-size="10" fill="#8ab49a">Chuvas intensas previstas para Mar 11. Considere proteção adicional</text>
  <text x="92" y="300" font-family="Georgia,serif" font-size="10" fill="#8ab49a">para as mudas recém-plantadas. Probabilidade: 87%</text>
  <rect x="364" y="268" width="80" height="30" rx="10" fill="url(#obtn)" filter="url(#og)"/>
  <text x="404" y="287" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#0d2818" text-anchor="middle">Ver mais</text>
</svg>
