  <!-- Calendar card -->
  <rect x="24" y="24" width="220" height="210" rx="14" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <rect x="24" y="24" width="220" height="4" rx="2" fill="url(#obtn)"/>
  <!-- Header -->
  <rect x="24" y="28" width="220" height="46" rx="10" fill="#0a1e12"/>
  <text x="134" y="56" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">Março 2025</text>
  <text x="44" y="56" font-family="Georgia,serif" font-size="16" fill="#4ade80">‹</text>
  <text x="228" y="56" font-family="Georgia,serif" font-size="16" fill="#4ade80" text-anchor="end">›</text>

  <!-- Day headers -->
  <g font-family="Georgia,serif" font-size="9" fill="#5a8a6e" text-anchor="middle">
    <text x="46" y="90">D</text><text x="78" y="90">S</text><text x="110" y="90">T</text>
    <text x="142" y="90">Q</text><text x="174" y="90">Q</text><text x="206" y="90">S</text><text x="232" y="90">S</text>
  </g>
  <line x1="32" y1="94" x2="236" y2="94" stroke="#2d5a3d" stroke-width="0.5"/>

  <!-- Dates row 1 -->
  <g font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">
    <text x="78" y="112">1</text><text x="110" y="112">2</text><text x="142" y="112">3</text>
    <text x="174" y="112">4</text><text x="206" y="112">5</text><text x="232" y="112">6</text>
  </g>
  <!-- Row 2 - plantio highlight -->
  <rect x="33" y="117" width="26" height="20" rx="5" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1"/>
  <text x="46" y="131" font-family="Georgia,serif" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="bold">7</text>
  <rect x="65" y="117" width="26" height="20" rx="5" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1"/>
  <text x="78" y="131" font-family="Georgia,serif" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="bold">8</text>
  <text x="110" y="131" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">9</text>
  <text x="142" y="131" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">10</text>
  <circle cx="174" cy="126" r="12" fill="#f59e0b" fill-opacity="0.9" filter="url(#og)"/>
  <text x="174" y="130" font-family="Georgia,serif" font-size="10" fill="#0d2818" text-anchor="middle" font-weight="bold">11</text>
  <text x="206" y="131" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">12</text>
  <text x="232" y="131" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">13</text>
  <!-- Row 3 -->
  <g font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">
    <text x="46" y="151">14</text><text x="78" y="151">15</text><text x="110" y="151">16</text>
    <text x="142" y="151">17</text><text x="174" y="151">18</text><text x="206" y="151">19</text><text x="232" y="151">20</text>
  </g>
  <!-- Row 4 - colheita -->
  <text x="46" y="171" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">21</text>
  <text x="78" y="171" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">22</text>
  <rect x="97" y="160" width="70" height="20" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="110" y="174" font-family="Georgia,serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">23</text>
  <text x="142" y="174" font-family="Georgia,serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">24</text>
  <text x="174" y="171" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">25</text>
  <text x="206" y="171" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">26</text>
  <text x="232" y="171" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">27</text>

