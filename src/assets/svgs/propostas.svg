  <text x="400" y="310" font-family="Georgia,serif" font-size="10" fill="#8ab49a" text-anchor="middle">Recusar</text>

  <!-- Summary bar -->
  <text x="240" y="348" font-family="Georgia,serif" font-size="9" fill="#5a8a6e" text-anchor="middle">Valor total em propostas: R$ 49.160 • 2 barter • 1 compra direta</text>
