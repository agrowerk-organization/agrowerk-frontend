  <!-- Main form card -->
  <rect x="52" y="24" width="288" height="312" rx="16" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <rect x="52" y="24" width="288" height="4" rx="2" fill="url(#obtn)"/>

  <!-- PASSO badge -->
  <rect x="68" y="40" width="72" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="104" y="55" font-family="Georgia,serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">PASSO 1</text>

  <!-- Title -->
  <text x="196" y="90" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">Cadastro de</text>
  <text x="196" y="110" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">Fornecedor</text>

  <!-- Building icon -->
  <circle cx="196" cy="162" r="36" fill="#0a1e12" stroke="#f59e0b" stroke-width="2" filter="url(#og)"/>
  <rect x="181" y="150" width="30" height="24" fill="#f59e0b" opacity="0.35"/>
  <rect x="185" y="143" width="22" height="10" fill="#f59e0b" opacity="0.6"/>
  <rect x="188" y="161" width="7" height="13" fill="#f59e0b"/>
  <rect x="199" y="161" width="7" height="13" fill="#f59e0b"/>
  <rect x="182" y="153" width="5" height="5" fill="#0a1e12" rx="1"/>
  <rect x="205" y="153" width="5" height="5" fill="#0a1e12" rx="1"/>
  <!-- verified badge -->
  <circle cx="224" cy="138" r="14" fill="#4ade80" filter="url(#gg)"/>
  <path d="M218 138 L222 142 L230 132" stroke="#0d2818" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fields -->
  <text x="68" y="222" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Razão Social</text>
  <rect x="68" y="226" width="256" height="28" rx="8" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1.5"/>
  <text x="82" y="244" font-family="Georgia,serif" font-size="11" fill="#e5e7eb">AgroInsumos Brasil Ltda.</text>
  <circle cx="306" cy="240" r="8" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <path d="M302 240 L306 244 L311 236" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="68" y="268" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">CNPJ</text>
  <rect x="68" y="272" width="256" height="28" rx="8" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1.5"/>
  <text x="82" y="290" font-family="Georgia,serif" font-size="11" fill="#e5e7eb">12.345.678/0001-90</text>
  <circle cx="306" cy="286" r="8" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <path d="M302 286 L306 290 L311 282" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="68" y="314" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Segmento</text>
  <rect x="68" y="318" width="256" height="28" rx="8" fill="#0a1e12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="82" y="336" font-family="Georgia,serif" font-size="11" fill="#f59e0b">Fertilizantes e Defensivos</text>
  <text x="312" y="336" font-family="Georgia,serif" font-size="12" fill="#f59e0b">▾</text>

  <!-- Side: Verification card -->
  <rect x="354" y="24" width="110" height="130" rx="14" fill="url(#card)" filter="url(#cs)" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="354" y="24" width="110" height="4" rx="2" fill="url(#gbtn)"/>
  <text x="409" y="52" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#4ade80" text-anchor="middle">Verificação</text>
  <circle cx="409" cy="92" r="28" fill="#0a1e12" stroke="#4ade80" stroke-width="2" filter="url(#gg)"/>
  <path d="M396 92 L405 101 L423 80" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="409" y="130" font-family="Georgia,serif" font-size="10" fill="#f59e0b" text-anchor="middle">⚡ em 24h</text>
  <text x="409" y="144" font-family="Georgia,serif" font-size="9" fill="#5a8a6e" text-anchor="middle">Processo rápido</text>

  <!-- Side: Docs card -->
  <rect x="354" y="168" width="110" height="168" rx="14" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <rect x="354" y="168" width="110" height="4" rx="2" fill="url(#obtn)"/>
  <text x="409" y="192" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">Documentação</text>
  <g font-family="Georgia,serif" font-size="9">
    <text x="366" y="214" fill="#4ade80">✓</text><text x="380" y="214" fill="#8ab49a">CNPJ ativo</text>
    <text x="366" y="232" fill="#4ade80">✓</text><text x="380" y="232" fill="#8ab49a">Contrato social</text>
    <text x="366" y="250" fill="#4ade80">✓</text><text x="380" y="250" fill="#8ab49a">Certificações</text>
    <text x="366" y="268" fill="#5a8a6e">○</text><text x="380" y="268" fill="#5a8a6e">Alvará</text>
    <text x="366" y="286" fill="#5a8a6e">○</text><text x="380" y="286" fill="#5a8a6e">Referências</text>
  </g>
  <!-- Progress bar -->
  <rect x="366" y="300" width="86" height="6" rx="3" fill="#0a1e12"/>
  <rect x="366" y="300" width="56" height="6" rx="3" fill="#f59e0b" filter="url(#og)"/>
  <text x="409" y="324" font-family="Georgia,serif" font-size="9" fill="#5a8a6e" text-anchor="middle">3 de 5 enviados</text>
</svg>
