  <circle cx="276" cy="110" r="22" fill="#0a1e12" stroke="#f87171" stroke-width="1.5" filter="url(#rg)"/>
  <rect x="268" y="100" width="16" height="18" rx="4" fill="#f87171" opacity="0.4"/>
  <rect x="272" y="97" width="8" height="6" rx="1" fill="#f87171" opacity="0.7"/>
  <rect x="268" y="122" width="4" height="8" fill="#f87171" opacity="0.5"/>
