  <rect x="250" y="148" width="38" height="6" rx="3" fill="#f87171" filter="url(#rg)"/>
  <text x="446" y="154" font-family="Georgia,serif" font-size="8" fill="#f87171" text-anchor="end">19%</text>

  <!-- Item 3: Defensivos -->
