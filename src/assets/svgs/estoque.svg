  <rect x="24" y="72" width="204" height="90" rx="12" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <rect x="24" y="72" width="204" height="4" rx="2" fill="#4ade80"/>
  <circle cx="60" cy="110" r="22" fill="#0a1e12" stroke="#4ade80" stroke-width="1.5" filter="url(#gg)"/>
  <ellipse cx="60" cy="110" rx="8" ry="10" fill="#4ade80" opacity="0.4"/>
  <ellipse cx="60" cy="108" rx="5" ry="7" fill="#4ade80"/>
  <text x="92" y="100" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#e5e7eb">Sementes Soja</text>
  <text x="92" y="113" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Disponível</text>
  <text x="92" y="130" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#4ade80">1.240 <tspan font-size="10" fill="#5a8a6e">kg</tspan></text>
  <rect x="34" y="148" width="184" height="6" rx="3" fill="#0a1e12"/>
  <rect x="34" y="148" width="132" height="6" rx="3" fill="#4ade80" filter="url(#gg)"/>
  <text x="218" y="154" font-family="Georgia,serif" font-size="8" fill="#4ade80" text-anchor="end">71%</text>

