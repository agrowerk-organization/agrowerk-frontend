  <!-- Alert panel -->
  <rect x="24" y="280" width="432" height="64" rx="12" fill="url(#card)" filter="url(#cs)" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="280" width="5" height="64" rx="3" fill="#f87171"/>
  <text x="42" y="302" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#f87171">🔔  Alertas de Estoque</text>
  <text x="42" y="317" font-family="Georgia,serif" font-size="10" fill="#8ab49a">Fertilizantes abaixo do mínimo (200kg) • Reposição urgente recomendada</text>
  <text x="42" y="330" font-family="Georgia,serif" font-size="10" fill="#8ab49a">Sementes: vencimento em 45 dias — lote S-2024-08</text>
  <rect x="374" y="291" width="70" height="30" rx="8" fill="url(#obtn)" filter="url(#og)"/>
  <text x="409" y="310" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#0d2818" text-anchor="middle">Repor</text>
</svg>
