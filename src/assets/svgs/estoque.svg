  <rect x="24" y="176" width="204" height="4" rx="2" fill="#a78bfa"/>
  <circle cx="60" cy="214" r="22" fill="#0a1e12" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="52" y="205" width="16" height="18" rx="4" fill="#a78bfa" opacity="0.4"/>
  <rect x="56" y="202" width="6" height="5" rx="1" fill="#a78bfa" opacity="0.7"/>
  <path d="M68 210 Q74 210 74 214" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
  <circle cx="74" cy="214" r="2" fill="#a78bfa"/>
  <text x="92" y="204" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#e5e7eb">Defensivos</text>
  <text x="92" y="217" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Disponível</text>
  <text x="92" y="234" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#a78bfa">46 <tspan font-size="10" fill="#5a8a6e">litros</tspan></text>
  <rect x="34" y="252" width="184" height="6" rx="3" fill="#0a1e12"/>
  <rect x="34" y="252" width="140" height="6" rx="3" fill="#a78bfa"/>
  <text x="218" y="258" font-family="Georgia,serif" font-size="8" fill="#a78bfa" text-anchor="end">76%</text>

  <!-- Item 4: Combustível -->
  <rect x="240" y="176" width="216" height="90" rx="12" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <rect x="240" y="176" width="216" height="4" rx="2" fill="#f59e0b"/>
  <circle cx="276" cy="214" r="22" fill="#0a1e12" stroke="#f59e0b" stroke-width="1.5" filter="url(#og)"/>
  <path d="M276 204 Q268 212 268 218 Q268 226 276 226 Q284 226 284 218 Q284 212 276 204Z" fill="#f59e0b" opacity="0.7"/>
  <ellipse cx="276" cy="218" rx="5" ry="4" fill="#0d2818" opacity="0.5"/>
  <text x="308" y="204" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#e5e7eb">Combustível</text>
  <text x="308" y="217" font-family="Georgia,serif" font-size="9" fill="#5a8a6e">Disponível</text>
  <text x="308" y="234" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#f59e0b">2.500 <tspan font-size="10" fill="#5a8a6e">litros</tspan></text>
