  <rect x="328" y="52" width="136" height="204" rx="10" fill="#0a1e12" stroke="#f59e0b" stroke-width="1"/>
  <rect x="328" y="52" width="136" height="32" rx="10" fill="#f59e0b" fill-opacity="0.08"/>
  <rect x="328" y="68" width="136" height="16" fill="#f59e0b" fill-opacity="0.08"/>
