  <text x="448" y="72" font-family="Georgia,serif" font-size="9" fill="#0d2818" text-anchor="middle" font-weight="bold">4</text>

  <rect x="336" y="92" width="120" height="80" rx="8" fill="url(#card)" stroke="#f59e0b" stroke-width="1" filter="url(#og)"/>
  <text x="346" y="110" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#e5e7eb">Faz. Horizontes</text>
