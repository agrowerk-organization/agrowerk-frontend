  <rect x="346" y="116" width="32" height="20" rx="3" fill="#f59e0b" fill-opacity="0.3"/>
  <rect x="378" y="120" width="18" height="16" rx="2" fill="#f59e0b" fill-opacity="0.4"/>
  <circle cx="354" cy="136" r="6" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="374" cy="136" r="6" fill="#f59e0b" fill-opacity="0.8"/>
  <rect x="346" y="148" width="100" height="6" rx="3" fill="#0a1e12"/>
  <rect x="346" y="148" width="67" height="6" rx="3" fill="#f59e0b" filter="url(#og)"/>
  <text x="396" y="162" font-family="Georgia,serif" font-size="9" fill="#f59e0b" text-anchor="middle">67% — 143km</text>

  <!-- NF section -->
  <rect x="16" y="268" width="448" height="76" rx="12" fill="url(#card)" filter="url(#cs)" stroke="#2d5a3d" stroke-width="1.5"/>
  <text x="30" y="290" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#f59e0b">📄  Emissão de Nota Fiscal</text>
  <rect x="30" y="298" width="108" height="34" rx="8" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1"/>
  <text x="84" y="311" font-family="Georgia,serif" font-size="9" fill="#4ade80" text-anchor="middle">NF-e 00458</text>
  <text x="84" y="323" font-family="Georgia,serif" font-size="8" fill="#5a8a6e" text-anchor="middle">Granja Esperança</text>

  <rect x="148" y="298" width="108" height="34" rx="8" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1"/>
  <text x="202" y="311" font-family="Georgia,serif" font-size="9" fill="#4ade80" text-anchor="middle">NF-e 00457</text>
  <text x="202" y="323" font-family="Georgia,serif" font-size="8" fill="#5a8a6e" text-anchor="middle">Faz. Santa Clara</text>

  <rect x="266" y="298" width="108" height="34" rx="8" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1"/>
  <text x="320" y="311" font-family="Georgia,serif" font-size="9" fill="#4ade80" text-anchor="middle">NF-e 00456</text>
  <text x="320" y="323" font-family="Georgia,serif" font-size="8" fill="#5a8a6e" text-anchor="middle">Sítio das Pedras</text>

  <rect x="386" y="278" width="66" height="54" rx="10" fill="url(#obtn)" filter="url(#og)"/>
  <text x="419" y="304" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0d2818" text-anchor="middle">Nova</text>
  <text x="419" y="318" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0d2818" text-anchor="middle">NF-e</text>
</svg>
