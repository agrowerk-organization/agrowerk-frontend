  <rect x="280" y="12" width="90" height="28" rx="8" fill="url(#card)" stroke="#2d5a3d" stroke-width="1"/>
  <text x="290" y="24" font-family="Georgia,serif" font-size="8" fill="#5a8a6e">Faturamento</text>
  <text x="290" y="36" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#f59e0b">R$1.2M</text>
  <rect x="380" y="12" width="76" height="28" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1" filter="url(#og)"/>
  <text x="418" y="24" font-family="Georgia,serif" font-size="8" fill="#f59e0b" text-anchor="middle">Pedidos</text>
  <text x="418" y="36" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">38</text>

