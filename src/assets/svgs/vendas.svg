  <text x="136" y="72" font-family="Georgia,serif" font-size="9" fill="#0d2818" text-anchor="middle" font-weight="bold">5</text>

  <rect x="24" y="92" width="120" height="56" rx="8" fill="url(#card)" stroke="#2d5a3d" stroke-width="1"/>
  <text x="34" y="110" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#e5e7eb">Fazenda Aurora</text>
  <text x="34" y="122" font-family="Georgia,serif" font-size="8" fill="#5a8a6e">NPK + Herb.</text>
  <text x="34" y="138" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#f59e0b">R$18.400</text>

  <rect x="24" y="156" width="120" height="56" rx="8" fill="url(#card)" stroke="#2d5a3d" stroke-width="1"/>
  <text x="34" y="174" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#e5e7eb">Sítio das Pedras</text>
  <text x="34" y="186" font-family="Georgia,serif" font-size="8" fill="#5a8a6e">Sementes + Inoc.</text>
  <text x="34" y="202" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#f59e0b">R$9.200</text>

  <rect x="24" y="220" width="120" height="28" rx="6" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1" stroke-dasharray="4,3"/>
