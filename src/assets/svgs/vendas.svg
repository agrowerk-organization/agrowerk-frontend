  <text x="292" y="72" font-family="Georgia,serif" font-size="9" fill="#0d2818" text-anchor="middle" font-weight="bold">8</text>

  <rect x="180" y="92" width="120" height="56" rx="8" fill="url(#card)" stroke="#4ade80" stroke-width="1"/>
  <text x="190" y="110" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#e5e7eb">Granja Esperança</text>
