  <text x="190" y="138" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#4ade80">R$45.000</text>

  <rect x="180" y="156" width="120" height="56" rx="8" fill="url(#card)" stroke="#4ade80" stroke-width="1"/>
  <text x="190" y="174" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#e5e7eb">Faz. Santa Clara</text>
  <text x="190" y="186" font-family="Georgia,serif" font-size="8" fill="#5a8a6e">Defensivos</text>
  <text x="190" y="202" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#4ade80">R$7.600</text>

