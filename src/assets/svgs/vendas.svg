  <rect x="16" y="52" width="136" height="204" rx="10" fill="#0a1e12" stroke="#2d5a3d" stroke-width="1"/>
  <rect x="16" y="52" width="136" height="32" rx="10" fill="#1a3a24"/>
  <rect x="16" y="68" width="136" height="16" fill="#1a3a24"/>
  <text x="72" y="71" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#5a8a6e" text-anchor="middle">EM NEGOCIAÇÃO</text>
