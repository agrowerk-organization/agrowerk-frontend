<div class="flex flex-col gap-4">
    <h4 class="text-footer-heading text-base font-bold uppercase tracking-wide">
      {{ title() }}
    </h4>
    
    <ul class="flex flex-col gap-2">
      @for (link of links(); track link.label) {
        <li>
          @if (link.external) {
            <a 
              [href]="link.url" 
              target="_blank" 
              rel="noopener noreferrer"
              class="flex items-center gap-2 text-footer-link transition-colors hover:text-footer-link-hover text-footer-text-primary cursor-pointer"
            >
              <fa-icon [icon]="link.icon" class="text-xs"></fa-icon>
              {{ link.label }}
            </a>
          } @else {
            <button
              (click)="link.action?.()"
              (keydown.enter)="link.action?.()"
              class="flex items-center gap-2 text-footer-link transition-colors hover:text-footer-link-hover text-footer-text-primary text-left w-full cursor-pointer"
            >
              <fa-icon [icon]="link.icon" class="text-xs"></fa-icon>
              {{ link.label }}
            </button>
          }
        </li>
      }
    </ul>
  </div>
