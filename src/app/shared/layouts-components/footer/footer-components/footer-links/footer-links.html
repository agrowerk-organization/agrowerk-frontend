<div class="flex flex-col gap-4">
  <h4 class="text-footer-heading text-2xl font-bold uppercase tracking-wide">
    {{ title() }}
  </h4>
  <ul class="flex flex-col gap-2">
    @for (link of links(); track link.label) {
      <li>
          <a 
            [href]="link.url" 
            class="flex items-center gap-2 text-xl transition-colors hover:text-footer-link-hover text-footer-text-primary cursor-pointer"
          >
            <fa-icon [icon]="link.icon" class="text-xs"></fa-icon>
            {{ link.label }}
          </a>
      </li>
    }
  </ul>
</div>
