<footer 
    class="relative py-4 md:py-10 lg:py-12 overflow-hidden bg-slate-950">
    
    <div class="absolute inset-0 
                bg-gradient-to-br from-emerald-900/40 via-green-900/30 to-transparent">
    </div>
    
    <div class="absolute inset-0 opacity-60" 
         style="background-size: 400px;">
            <app-pattern></app-pattern>
        </div>
    
    <div class="absolute -top-40 -right-40 w-96 h-96 
                bg-emerald-500/10 rounded-full blur-3xl"></div>
    
    <div class="relative z-10 max-w-8xl mx-auto px-6 lg:px-12">

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6
                    gap-8 lg:gap-12 mb-12">

                <div class="lg:col-span-2">
                    <app-footer-brand></app-footer-brand>
                </div>

                <app-footer-links
                    [title]="'Legislação e Governo'"
                    [links]="legislationLinks">
                </app-footer-links>

                <app-footer-links 
                    [title]="'Sobre nós'"
                    [links]="companyLinks">
                </app-footer-links>

                <app-footer-links 
                    [title]="'Produto'"
                    [links]="productLinks">
                </app-footer-links>

                <app-footer-links
                    [title]="'Suporte'"
                    [links]="supportLinks">
                </app-footer-links>

        </div>

        <div class="mb-10">
            <app-footer-social>
            </app-footer-social>
        </div>

        <app-footer-bottom>
        </app-footer-bottom>

    </div>

</footer>
