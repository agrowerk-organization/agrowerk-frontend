<div class="flex flex-col items-center text-center animate-in fade-in slide-in-from-bottom-4 duration-300">

    <div class="w-20 h-20 rounded-full bg-green-500/10 border border-green-500/30
                flex items-center justify-center mb-6">
      <fa-icon [icon]="icons.CHECK_CIRCLE" class="text-4xl text-green-500" />
    </div>
  
    <h3 class="text-2xl font-semibold text-neutral-secondary mb-2">
      Senha redefinida com sucesso!
    </h3>
    <p class="text-neutral-secondary/60 text-lg leading-relaxed mb-8">
      Sua senha foi atualizada.<br>
      Já pode acessar sua conta normalmente.
    </p>
  
    <div class="w-full bg-white/5 border-2 border-primary/80 rounded-xl p-4 mb-8 text-left shadow-2xl shadow-primary/30">
      <p class="flex items-center justify-center text-xl sm:text-2xl text-neutral-secondary/80 mb-3">Próximos passos</p>
      <div class="flex flex-col gap-3">
        <div class="flex items-start gap-3">
          <span class="w-8 h-8 rounded-full bg-primary/70 text-neutral-secondary text-xl
                       flex items-center justify-center flex-shrink-0 mt-0.5 font-medium">1</span>
          <p class="text-lg sm:text-xl text-primary">
            Clique em "Ir para o login" abaixo
          </p>
        </div>
        <div class="flex items-start gap-3">
          <span class="w-8 h-8 rounded-full bg-primary/70 text-neutral-secondary text-xl
                       flex items-center justify-center flex-shrink-0 mt-0.5 font-medium">2</span>
          <p class="text-lg sm:text-xl text-primary">
            Entre com seu e-mail e sua nova senha
          </p>
        </div>
      </div>
    </div>
  
    <button type="button" (click)="goLogin.emit()"
            class="w-full py-3 px-6 rounded-xl font-semibold text-xl text-neutral-primary
                   bg-[var(--color-primary)] hover:bg-[var(--color-button-second)]
                   transition-all duration-300 cursor-pointer">
      Ir para o login
    </button>
  
</div>
