<div class="relative z-10 w-full h-full flex items-center justify-center
            bg-gradient-to-br from-black/80 via-black/70 to-emerald-950/40
            backdrop-blur-xl border-l border-white/5
            shadow-[-20px_0_60px_rgba(0,0,0,0.5)]
            p-8 lg:p-12 overflow-y-auto">
  <div class="w-full max-w-md">

    <div class="mb-6 animate-[fadeInUp_0.4s_ease-out]">
      <app-title [firstSegment]="titleFirst()" [secondSegment]="titleSecond()" />
      <app-subtitle [text]="subtitle()" />
    </div>

    <div class="flex items-center gap-3 mb-8 animate-[fadeInUp_0.45s_ease-out]">

      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xl font-bold transition-all duration-300"
            [class.text-neutral-secondary]="currentStep() === 1"
            [class.text-primary]="currentStep() > 1">
        @if (currentStep() > 1) {
            <fa-icon [icon]="icons.CHECK" class="text-lg" />
        } @else { 1 }
        </div>
        <span class="text-xl font-medium transition-colors duration-300"
                [class.neutral-secondary]="currentStep() === 1"
                [class.text-primary]="currentStep() > 1">
            Dados pessoais
        </span>
        </div>

      <div class="flex-1 h-px transition-colors duration-500"
           [class.bg-\[var\(--color-primary\)\]]="currentStep() === 2"
           [class.bg-white\/15]="currentStep() === 1">
      </div>

        <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xl font-bold transition-all duration-300"
                [class.bg-\[var\(--color-primary\)\]]="currentStep() === 2"
                [class.text-white]="currentStep() === 2"
                [class.bg-white\/15]="currentStep() < 2"
                [class.text-white\/40]="currentStep() < 2">
                2
        </div>
            <span class="text-xl font-medium transition-colors duration-300"
                    [class.text-primary]="currentStep() === 2"
                    [class.text-white\/40]="currentStep() < 2">
                Dados de Acesso
            </span>
        </div>

    </div>

    @if (successMessage()) {
      <div class="flex items-center gap-3 p-4 mb-6 bg-green-50 border border-green-200 rounded-xl
                  animate-in fade-in slide-in-from-top-2">
        <fa-icon [icon]="icons.CHECK_CIRCLE" class="text-green-600 text-lg flex-shrink-0" />
        <p class="text-sm text-green-700 font-medium">{{ successMessage() }}</p>
      </div>
    }
    @if (errorMessage()) {
      <div class="p-4 mb-6 bg-red-50 border border-red-200 rounded-xl
                  animate-in fade-in slide-in-from-top-2">
        <p class="text-sm text-[var(--color-error)] font-medium">{{ errorMessage() }}</p>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="animate-[fadeInUp_0.55s_ease-out]">
      @switch (currentStep()) {
        @case (1) {
          <app-step-personal-data
            [form]="form"
            [submitted]="submitted()"
            (next)="nextStep()"
          />
        }
        @case (2) {
          <app-step-access-data
            [form]="form"
            [roles]="roles()"
            [loading]="isLoading()"
            [submitted]="submitted()"
            [isLoadingRoles]="isLoadingRoles()"
            (back)="prevStep()"
          />
        }
      }
    </form>

    <p class="text-center text-xl text-[var(--color-neutral-secondary)]/55 mt-6">
      Já tem uma conta?
      <a [routerLink]="loginRoute()"
         class="text-xl font-semibold text-[var(--color-primary)] hover:underline ml-1 cursor-pointer">
        Entrar
      </a>
    </p>

  </div>
</div>
