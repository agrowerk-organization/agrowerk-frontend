<div [formGroup]="form()" class="animate-in fade-in slide-in-from-right-4 duration-300">

    <div class="mt-4">
      <label for="reg-email" class="field-label text-neutral-secondary text-xl">E-mail</label>
      <input id="reg-email" type="email" formControlName="email"
             placeholder="seu@email.com" autocomplete="email" class="field-input" />
      <app-field-error [control]="form().get('email')" [submitted]="submitted()" />
    </div>
  
    <div class="mt-4">
      <label for="reg-password" class="field-label text-neutral-secondary text-xl">Senha</label>
      <div class="relative">
        <input id="reg-password" formControlName="password"
               [type]="showPassword() ? 'text' : 'password'"
               placeholder="Mínimo 8 caracteres" autocomplete="new-password"
               class="field-input pr-12" />
        <button type="button" (click)="togglePassword()" class="password-toggle">
          <fa-icon [icon]="showPassword() ? icons.EYE : icons.EYE_SLASH" class="text-xl cursor-pointer" />
        </button>
      </div>
      
      <app-field-error [control]="form().get('password')" [submitted]="submitted()" />
    </div>
  
    <div class="mt-4">
      <label for="reg-confirm-password" class="field-label text-neutral-secondary text-xl">Confirmar senha</label>
      <div class="relative">
        <input id="reg-confirm-password" formControlName="confirmPassword"
               [type]="showConfirm() ? 'text' : 'password'"
               placeholder="Repita sua senha" autocomplete="new-password"
               class="field-input pr-12" />
        <button type="button" (click)="toggleConfirm()" class="password-toggle">
          <fa-icon [icon]="showConfirm() ? icons.EYE : icons.EYE_SLASH" class="text-xl cursor-pointer" />
        </button>
      </div>
      <app-field-error 
        [control]="form().get('confirmPassword')" 
        [submitted]="submitted()"
        [formGroup]="form()" 
        groupError="passwordMismatch"
        groupErrorMessage="As senhas não coincidem" />
    </div>

    <div class="mt-6">
        <label class="flex items-start gap-3 cursor-pointer group">
            <input
            type="checkbox"
            formControlName="lgpdConsent"
            class="mt-1 flex-shrink-0 w-7 h-7 rounded border border-primary bg-neutral-secondary
                   appearance-none cursor-pointer outline-none transition-all duration-200
                   checked:bg-[var(--color-primary)] checked:border-[var(--color-primary)]
                   focus:ring-2 focus:ring-[var(--color-primary)]/30 focus:ring-offset-0
                   relative"
          />
          <span class="text-lg text-neutral-secondary leading-relaxed group-hover:text-white/75 transition-colors">
            Li e concordo com a
            <a href="/privacidade" target="_blank"
               class="text-[var(--color-primary)] hover:underline font-medium">
              Política de Privacidade
            </a>
            e autorizo o tratamento dos meus dados pessoais conforme a
            <strong class="text-neutral-secondary/80">Lei Geral de Proteção de Dados (LGPD)</strong>.
          </span>
        </label>
        <app-field-error [control]="form().get('lgpdConsent')" [submitted]="submitted()" />
    </div>
  
    <div class="flex flex-col md:flex-row gap-3 mt-8">
      <button type="button" (click)="back.emit()"
              class="flex-1 py-3 px-6 rounded-xl font-semibold text-2xl
                     border-2 border-neutral-secondary text-[var(--color-neutral-secondary)]/70
                     hover:border-white/30 hover:text-[var(--color-neutral-secondary)]
                     transition-all duration-300 cursor-pointer
                     flex items-center justify-center gap-2">
        <fa-icon [icon]="icons.ARROW_LEFT" class="text-neutral-secondary" />
        Voltar
      </button>
  
      <button type="button" (click)="register.emit()" [disabled]="loading()"
              class="flex-1 py-3 px-6 rounded-xl font-semibold text-2xl text-neutral-primary
                     bg-[var(--color-primary)] hover:bg-[var(--color-button-second)]
                     transition-all duration-300 shadow-lg shadow-[var(--color-primary)]/20
                     disabled:opacity-60 disabled:cursor-not-allowed
                     flex items-center justify-center gap-2 cursor-pointer">
        @if (loading()) {
          <fa-icon [icon]="icons.SPINNER" class="animate-spin" />
          <span>Criando...</span>
        } @else {
          <span>Criar conta</span>
        }
      </button>
    </div>
  
</div>
