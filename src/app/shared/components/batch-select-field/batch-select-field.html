<div class="flex flex-col gap-1">

    <label for="{{ fieldId() }}" class="text-xl text-neutral-secondary font-bold mb-1 block">
      {{ label() }}
    </label>
  
    <div class="relative">
  
      <button type="button"
              (click)="toggle()"
              [disabled]="isDisabled()"
              class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                     bg-neutral-primary text-left flex items-center justify-between gap-3
                     transition-all duration-200 cursor-pointer
                     hover:border-primary hover:shadow-[0_0_12px_rgba(76,175,80,0.2)]
                     focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30
                     disabled:opacity-50 disabled:cursor-not-allowed"
              [class.border-primary]="isOpen()"
              [class.shadow-primary]="isOpen()">
  
        @if (selectedOption()) {
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <fa-icon [icon]="icons.BOXES" class="text-primary text-lg shrink-0" />
            <div class="flex flex-col min-w-0">
              <span class="text-lg font-bold text-neutral-secondary truncate">
                {{ selectedOption()!.label }} · Lote {{ selectedOption()!.batchNumber }}
              </span>
              <div class="flex items-center gap-3 mt-0.5">
                <span class="text-lg text-primary font-semibold">
                  {{ selectedOption()!.quantity }} {{ selectedOption()!.unit }}
                </span>
                <span class="text-neutral-secondary/40 text-xs">·</span>
                <span class="text-lg text-amber-400 font-semibold">
                  {{ selectedOption()!.unitPrice | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
                </span>
              </div>
            </div>
          </div>
        } @else {
          <span class="text-neutral-secondary/40 text-lg">Selecione um lote...</span>
        }
  
        <fa-icon [icon]="icons.CHEVRON_DOWN"
                 class="text-primary text-base shrink-0 transition-transform duration-200"
                 [class.rotate-180]="isOpen()" />
      </button>
  
      @if (isOpen()) {
        <div class="absolute z-50 w-full mt-2 rounded-2xl border-2 border-primary/70
                    bg-neutral-primary shadow-2xl shadow-primary/20 overflow-hidden">
  
          <div class="max-h-64 overflow-y-auto">
            @for (option of options(); track option.value) {
              <button type="button"
                      (click)="select(option)"
                      class="w-full px-4 py-3 flex items-center gap-3 text-left
                             transition-all duration-150 cursor-pointer
                             hover:bg-primary/10 hover:text-primary
                             border-b border-primary/10 last:border-0">
  
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="text-base font-bold text-neutral-secondary truncate">
                      {{ option.label }}
                    </span>
                    <span class="text-sm text-neutral-secondary/50 shrink-0">
                      Lote {{ option.batchNumber }}
                    </span>
                  </div>
                  <div class="flex items-center gap-3 mt-0.5">
                    <span class="text-sm font-semibold text-primary">
                      {{ option.quantity }} {{ option.unit }}
                    </span>
                    <span class="text-neutral-secondary/30 text-xs">·</span>
                    <span class="text-sm font-semibold text-amber-400">
                      {{ option.unitPrice | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
                    </span>
                  </div>
                </div>
  
                @if (selectedValue() === option.value) {
                  <fa-icon [icon]="icons.CHECK" class="text-primary text-sm shrink-0" />
                }
  
              </button>
            }
          </div>
  
        </div>
      }
  
    </div>
  
</div>
