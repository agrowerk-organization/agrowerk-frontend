<div class="flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-neutral-primary rounded-2xl shadow-2xl p-8 text-center border border-error/30">
      
      <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-error/20 mb-4">
        <fa-icon [icon]="errorIcon()" class="text-4xl text-error"></fa-icon>
      </div>

      <h3 class="text-xl font-bold text-neutral-tertiary mb-2">{{ title() }}</h3>
      
      <p class="text-error mb-6 text-base">{{ message() }}</p>

      <button 
        (click)="retry.emit()"
        [disabled]="retrying()"
        class="w-full bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary text-neutral-tertiary font-bold py-3 px-6 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-green-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 disabled:opacity-50">
        
        {{ retrying() ? retryingText() : retryText() }}
      </button>
    </div>
</div>
