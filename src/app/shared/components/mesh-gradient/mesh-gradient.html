<div class="fixed inset-0 -z-20 bg-[var(--color-background)]">
  <div class="absolute inset-0 bg-gradient-to-br from-[var(--color-primary)]/50 via-transparent to-[var(--color-success)]/30"></div>
</div>

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="absolute -top-1/4 -left-1/4 w-full h-full bg-gradient-radial from-[var(--color-primary)]/12 
              via-transparent to-transparent animate-pulse-slow"></div>
  <div class="absolute -bottom-1/4 -right-1/4 w-full h-full bg-gradient-radial from-[var(--color-success)]/8 
              via-transparent to-transparent animate-pulse-slow" style="animation-delay: 1.5s;"></div>
</div>

<div class="fixed inset-0 -z-10 opacity-150">  
  <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(76, 175, 80, 0.08)" stroke-width="1"/>  
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </svg>
</div>

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="particle animate-float"></div>  
  <div class="particle animate-float-delayed"></div>
  <div class="particle animate-float" style="animation-delay: 6s;"></div>
  <div class="particle animate-float-delayed" style="animation-delay: 9s;"></div>
</div>
