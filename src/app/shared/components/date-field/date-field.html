<div class="flex flex-col gap-1">

  @if (label()) {
    <label [for]="fieldId()"
           class="text-xl text-neutral-secondary font-bold mb-1 block">
      {{ label() }}
    </label>
  }

  <div class="relative">
    <input #dateInput
           [id]="fieldId()"
           type="text"
           placeholder="dd/mm/aaaa"
           readonly
           class="w-full px-4 py-4 pr-12 rounded-2xl border-2 border-primary/90
                  bg-transparent text-lg text-neutral-secondary
                  focus:border-primary focus:outline-none
                  transition-all cursor-pointer
                  disabled:opacity-50 disabled:cursor-not-allowed
                  placeholder:text-neutral-secondary/40" />

    <button type="button"
            (click)="openPicker()"
            class="absolute right-3 top-1/2 -translate-y-1/2
                   text-primary hover:text-primary/70">
      <fa-icon [icon]="icons.CALENDAR" class="text-xl" />
    </button>
  </div>

</div>
