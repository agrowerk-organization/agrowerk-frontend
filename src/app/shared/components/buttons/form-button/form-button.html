<button
  [type]="type()"
  [disabled]="disabled() || isLoading()"
  class="w-full py-3 px-4 bg-[var(--color-button-main)] text-white font-semibold rounded-lg hover:bg-[var(--color-button-main-hover)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--color-primary)] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center space-x-2"
>
  @if (isLoading()) {
    <img 
      src="assets/svgs/loading.svg" 
      alt="Carregando" 
      class="animate-spin h-5 w-5 text-white" 
    />
  }

  <span>
    {{ isLoading() ? loadingLabel() : label() }}
  </span>
</button>
