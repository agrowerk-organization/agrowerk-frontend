<div class="relative w-full">

    <label [for]="fieldId()"
           class="text-lg sm:text-xl text-neutral-secondary font-bold mb-1 block">
      {{ label() }}
    </label>
  
    <button type="button"
            [id]="fieldId()"
            (click)="toggle()"
            [class.opacity-50]="isDisabled()"
            [class.cursor-not-allowed]="isDisabled()"
            class="w-full flex items-center justify-between gap-3
                   px-4 py-3 rounded-xl
                   border-2 border-primary/70 hover:border-primary
                   bg-neutral-primary text-primary
                   transition-all duration-200 cursor-pointer
                   focus:outline-none focus:border-primary focus:shadow-[0_0_0_3px_rgba(var(--color-primary),0.15)]">
            <span class="text-lg sm:text-xl text-neutral-secondary transition-colors"
                [class.opacity-40]="!selectedValue()">
                {{ selectedValue() ? selectedLabel : placeholder() }}
            </span>
  
      <fa-icon [icon]="icons.chevron"
               class="text-primary/70 transition-transform duration-200"
               [class.rotate-180]="isOpen()" />
    </button>
  
    @if (isOpen()) {
      <div class="absolute z-50 w-full mt-2
                  rounded-2xl border-2 border-primary/60
                  bg-neutral-primary shadow-xl shadow-primary/20
                  overflow-y-auto max-h-50 animate-fadeInUp">
  
        @for (option of options(); track option.value) {
          <button type="button"
                  (click)="select(option)"
                  class="w-full flex items-center justify-between
                         px-4 py-3 text-left text-xl sm:text-2xl text-neutral-secondary
                         hover:bg-primary/10 transition-colors duration-150
                         border-b border-primary/20 last:border-0 cursor-pointer">
  
            <span class="text-lg sm:text-xl text-neutral-secondary transition-colors">{{ option.label }}</span>
  
            @if (selectedValue() === option.value) {
              <fa-icon [icon]="icons.check" class="text-neutral-secondary text-xl" />
            }
          </button>
        }
  
      </div>
    }
  
</div>
