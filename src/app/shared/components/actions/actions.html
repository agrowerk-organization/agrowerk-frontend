<div class="flex flex-col sm:flex-row items-center justify-center gap-6 animate-fadeInUp" style="animation-delay: 0.3s;">
    @for (action of actions(); track $index) {
      <button
        [style.--btn-width]="width()"
        [style.--btn-mobile-width]="mobileWidth()"
        class="group relative flex items-center justify-between gap-3 
               py-4 px-6 rounded-2xl font-bold text-2xl 
               transition-all duration-300 overflow-hidden
               cursor-pointer w-[var(--btn-mobile-width)] sm:w-[var(--btn-width)]"
        [ngClass]="{
          'bg-gradient-to-br from-button-main to-button-second text-neutral-primary shadow-lg hover:shadow-2xl hover:-translate-y-1 active:translate-y-0': action.type === 'primary',
          'bg-neutral-primary text-primary border-2 border-primary hover:bg-primary hover:text-neutral-primary hover:shadow-lg hover:-translate-y-1': action.type === 'secondary'
        }"
        
        (click)="action.action">
        
        @if (action.type === 'primary') {
          <span class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent 
                       -translate-x-full group-hover:translate-x-full transition-transform duration-700">
          </span>
        }
  
        <span class="relative z-10">
          {{ action.title }}
        </span>
  
        <fa-icon
          class="relative z-10 text-2xl transition-transform duration-300 
                 group-hover:translate-x-2"
          [icon]="action.icon">
        </fa-icon>
      </button>
    }
  </div>
