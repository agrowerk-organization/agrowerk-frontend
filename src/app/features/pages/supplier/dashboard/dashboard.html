<div class="min-h-full">

    @if (isLoading()) {
      <div class="p-6 max-w-5xl mx-auto space-y-4 animate-pulse">
        <div class="h-10 bg-white/5 rounded-2xl w-1/3 mx-auto"></div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
          @for (i of [1,2,3,4]; track i) {
            <div class="h-40 bg-white/5 rounded-3xl"></div>
          }
        </div>
        <div class="h-24 bg-white/5 rounded-3xl"></div>
      </div>
    }
  
    @else if (!hasSupplier()) {
      <app-onboarding-card (register)="goToRegister()" />
    }
  
    @else {
      <div class="p-6 max-w-7xl mx-auto space-y-6">
  
        @if (layoutState.showCycle()) {
          <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <!-- Os quatro cards do ciclo virão aqui como componentes dedicados -->
            <!-- ex: <app-cycle-inventory-card /> -->
            <!-- ex: <app-cycle-negotiation-card /> -->
            <!-- ex: <app-cycle-contract-card /> -->
            <!-- ex: <app-cycle-barter-card /> -->
          </section>
        }
  
        <!-- Linha: alertas + atividade recente -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- <app-supplier-alerts-card /> -->
          <!-- <app-supplier-activity-card /> -->
        </section>
  
        <!-- Gráfico de performance -->
        <!-- <app-supplier-statistics-card /> -->
  
        <!-- Produtores conectados -->
        <!-- <app-supplier-producers-card /> -->
  
      </div>
    }
  
</div>
