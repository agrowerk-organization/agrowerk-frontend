<!-- badge.component.html -->
<div class="flex items-center justify-center gap-3 flex-wrap animate-fadeInUp" style="animation-delay: 0.1s;">
    @for(badge of badges; track $index) {
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full transition-all duration-300 
                  bg-[gradient-to-br from-primary/5 to-primary/30] 
                  border border-primary/70
                  hover:border-primary hover:shadow-lg hover:scale-105">
        
        <fa-icon 
          class="text-base text-[var(--color-neutral-secondary-dm)]"
          [icon]="badge.icon">
        </fa-icon>
        
        <span class="text:sm font-semibold text-[var(--color-neutral-secondary-dm)]">
          {{ badge.text }}
        </span>
      </div>
    }
</div>
