<div class="grid gap-4 animate-fadeInUp" style="animation-delay: 0.2s;">
    @for (step of steps; track $index) {
      <div class="group flex gap-4 p-4 bg-neutral-primary rounded-2xl 
                  border border-primary/20
                  transition-all duration-300 
                  hover:border-primary hover:shadow-xl hover:-translate-y-1">
        
        <div class="flex-shrink-0">
          <div class="flex items-center justify-center w-14 h-14 
                      bg-gradient-to-br from-primary to-button-second 
                      text-neutral-primary rounded-xl shadow-lg
                      group-hover:scale-110 transition-transform duration-300">
            <fa-icon 
              class="text-xl"
              [icon]="step.icon">
            </fa-icon>
          </div>
        </div>
  
        <div class="flex-1 min-w-0">
          <h4 class="text-base font-bold text-primary mb-1 leading-tight">
            {{ step.title }}
          </h4>
          <p class="text-sm text-neutral-secondary leading-relaxed">
            {{ step.subtitle }}
          </p>
        </div>
      </div>
    }
</div>
