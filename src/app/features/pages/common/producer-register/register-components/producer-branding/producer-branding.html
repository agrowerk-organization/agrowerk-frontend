<article class="relative z-10 w-full h-full min-h-screen overflow-hidden flex flex-col items-center justify-start p-12">

  <div class="absolute inset-0 z-0 pointer-events-none">
    <app-mesh-gradient />
    <app-pattern />
  </div>

  <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-primary/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-2 right-10 w-96 h-96 bg-[var(--color-button-second)]/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-xl flex flex-col items-center justify-center space-y-6">

    <div class="bg-gradient-to-br from-neutral-primary/95 to-neutral-primary/90 backdrop-blur-sm
                rounded-3xl p-12  border-3 border-primary/60
                animate-[fadeInUp_0.65s_ease-out] shadow-2xl shadow-primary/70">
      
      <app-title firstSegment="Bem-vindo" secondSegment="Produtor Rural" />
      <app-subtitle text="Gerencie sua propriedade com eficiência, precisão e conformidade legal" /> 
    </div>

    <div class="flex items-center justify-center gap-3 flex-wrap
        pt-5 border-t border-primary/20
        animate-[fadeInUp_1s_ease-out]">
    @for (trust of trusts; track $index) {
      <div class="bg-gradient-to-br from-primary/90 to-primary/10 inline-flex items-center gap-2
              px-4 py-2 rounded-full border border-primary/70
              hover:border-primary hover:shadow-lg hover:scale-105
              transition-all duration-300">
        <fa-icon [icon]="trust.icon" class="text-lg text-[var(--color-neutral-secondary)]" />
        <span class="text-lg font-semibold text-[var(--color-neutral-secondary)]">
          <strong class="text-quartenary">{{ trust.title }}</strong>
          {{ trust.subtitle }}
        </span>
      </div>
    }
    </div>

    <div class="grid gap-3 animate-[fadeInUp_0.8s_ease-out]">
      @for (step of steps; track step.number) {
        <div class="group flex gap-4 p-4 bg-neutral-primary/80 rounded-2xl
                    border-3 border-primary/40 backdrop-blur-sm
                    transition-all duration-300 shadow-2xl shadow-primary/70
                    hover:border-primary hover:shadow-4xl hover:-translate-y-0.5">

          <div class="flex-shrink-0">
            <div class="flex items-center justify-center w-11 h-11
                        bg-gradient-to-br from-[var(--color-primary)] to-[var(--color-button-second)]
                        text-white rounded-xl shadow-lg
                        group-hover:scale-110 transition-transform duration-300">
              <fa-icon [icon]="step.icon" class="text-lg" />
            </div>
          </div>

          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <h4 class="text-xl font-bold text-[var(--color-primary)] leading-tight">
              {{ step.title }}
            </h4>
            <p class="text-lg text-white/85 leading-relaxed">
              {{ step.description }}
            </p>
          </div>
        </div>
      }
    </div>

  </div>
</article>
