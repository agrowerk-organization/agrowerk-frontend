<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
         (click)="toCancel.emit()"
         (keydown.escape)="toCancel.emit()"
         tabindex="-1" role="presentation"></div>
  
    <div class="relative z-10 w-full mt-8 max-w-2xl max-h-[85vh] flex flex-col rounded-3xl
                bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">
  
      <div class="flex items-center justify-between p-6 border-b border-primary/30">
        <h2 class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">Novo Lote</h2>
        <button type="button" (click)="toCancel.emit()"
                class="w-12 h-12 flex items-center justify-center rounded-xl border-2 border-primary/30
                       text-primary hover:border-primary transition-all cursor-pointer">
          <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
        </button>
      </div>
  
      <div class="overflow-y-auto flex-1">
        <form id="batchForm" class="p-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="batch-number" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Nº do Lote *
              </label>
              <input id="batch-number" formControlName="batchNumber" type="text" placeholder="Ex: LOT-2025-001"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary focus:border-primary outline-none transition-all" />
            </div>
            <div>
              <label for="invoice-number" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Nº Nota Fiscal
              </label>
              <input id="invoice-number" formControlName="invoiceNumber" type="text" placeholder="Ex: NF-000123"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary focus:border-primary outline-none transition-all" />
            </div>
          </div>
  
          <div>
            <label for="input" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-2 block">Insumo *</label>
            <button type="button" (click)="pickerOpen.set(!pickerOpen())"
                    class="w-full flex items-center justify-between gap-3 px-4 py-4 rounded-2xl
                           border-2 border-primary/90 bg-transparent hover:border-primary transition-all cursor-pointer">
              @if (selectedInput(); as inp) {
                <div class="flex items-center gap-3">
                  <fa-icon [icon]="icons.FLASK" class="text-primary" />
                  <span class="text-lg font-bold text-neutral-secondary">{{ inp.name }}</span>
                </div>
              } @else {
                <span class="text-secondary/40 text-lg">Selecione um insumo...</span>
              }
              <fa-icon [icon]="icons.CHEVRON_DOWN" class="text-primary/60 text-sm transition-transform"
                       [class.rotate-180]="pickerOpen()" />
            </button>
  
            @if (pickerOpen()) {
              <div class="mt-2 rounded-2xl border-2 border-primary/30 bg-black/20 max-h-44 overflow-y-auto">
                @for (inp of inputs(); track inp.id) {
                  <button type="button" (click)="selectInput(inp)"
                          class="w-full flex items-center gap-3 px-4 py-3 transition-all cursor-pointer
                                 border-b border-primary/10 last:border-0"
                          [class]="selectedInput()?.id === inp.id ? 'bg-primary/10 text-primary' : 'hover:bg-primary/5 text-secondary'">
                    <fa-icon [icon]="icons.FLASK" class="text-sm text-primary/50 shrink-0" />
                    <span class="text-sm font-bold text-left">{{ inp.name }}</span>
                  </button>
                }
              </div>
            }
          </div>
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-number-field
              label="Quantidade Inicial *"
              fieldId="initial-qty"
              [min]="0.001"
              [step]="0.1"
              formControlName="initialQuantity" />
  
            <app-number-field
              label="Preço Unitário (R$) *"
              fieldId="unit-price"
              [min]="0.01"
              [step]="0.01"
              formControlName="unitPrice" />
          </div>
  
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label for="mfg-date" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Fabricação *
              </label>
              <input id="mfg-date" formControlName="manufacturingDate" type="date"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary focus:border-primary outline-none transition-all" />
            </div>
            <div>
              <label for="exp-date" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Validade *
              </label>
              <input id="exp-date" formControlName="expirationDate" type="date"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary focus:border-primary outline-none transition-all" />
            </div>
            <div>
              <label for="entry-date" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Entrada *
              </label>
              <input id="entry-date" formControlName="entryDate" type="date"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary focus:border-primary outline-none transition-all" />
            </div>
          </div>
  
          <div>
            <label for="batch-notes" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
              Observações
            </label>
            <textarea id="batch-notes" formControlName="notes" rows="2"
                      placeholder="Informações adicionais sobre o lote..."
                      class="w-full px-4 py-3 rounded-2xl border-2 border-primary/90
                             bg-transparent text-lg text-neutral-secondary
                             focus:border-primary outline-none transition-all resize-none"></textarea>
          </div>
  
        </form>
      </div>
  
      <div class="p-6 border-t border-primary/30 flex flex-col sm:flex-row gap-3">
        <app-button-pages text="Cancelar" [icon]="icons.CIRCLE_XMARK" width="100%" (action)="toCancel.emit()" />
        <app-button-pages
          [text]="saving() ? 'Salvando...' : 'Criar Lote'"
          [icon]="saving() ? icons.SPINNER : icons.PLUS"
          [disabled]="saving() || form.invalid"
          width="100%"
          (action)="submit()" />
      </div>
  
    </div>
</div>
