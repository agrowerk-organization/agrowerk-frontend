<div class="relative z-10 w-full min-h-screen flex items-center justify-center
            bg-gradient-to-br from-black/80 via-black/40 to-emerald-950/90
            backdrop-blur-xl border-l border-neutral-secondary/5
            shadow-[-20px_0_60px_rgba(0,0,0,0.5)]
            p-8 lg:p-12 overflow-y-auto">
  
  <div class="w-full max-w-xl flex flex-col justify-center py-10 px-6">

    <div class="mb-6 animate-[fadeInUp_0.4s_ease-out]">
      <app-title firstSegment="Recuperar" secondSegment="Senha" />
      <app-subtitle text="Vamos te ajudar a acessar sua conta novamente" />
    </div>

    @if (successMessage()) {
      <div class="flex items-center gap-3 p-4 mb-6 bg-green-50 border border-green-200 rounded-xl
                  animate-in fade-in slide-in-from-top-2">
        <p class="text-sm text-green-700 font-medium">{{ successMessage() }}</p>
      </div>
    }

    @if (errorMessage()) {
      <div class="p-4 mb-6 bg-red-50 border border-red-200 rounded-xl
                  animate-in fade-in slide-in-from-top-2">
        <p class="text-sm text-[var(--color-error)] font-medium">{{ errorMessage() }}</p>
      </div>
    }

    <div class="animate-[fadeInUp_0.55s_ease-out]">
      @switch (currentStep()) {

        @case (1) {
          <app-step-email
            [form]="emailForm"
            [submitted]="submitted()"
            [loading]="isLoading()"
            (next)="onSubmitEmail()"
          />
        }

        @case (2) {
          <app-step-code
            [form]="codeForm"
            [submitted]="submitted()"
            [loading]="isLoading()"
            [email]="emailForm.value.email ?? ''"
            (next)="onSubmitCode()"
            (back)="goBack()"
          />
        }

        @case (3) {
          <app-step-password
            [form]="passwordForm"
            [submitted]="submitted()"
            [loading]="isLoading()"
            (next)="onSubmitPassword()"
            (back)="goBack()"
          />
        }

        @case (4) {
          <app-step-reset-success
            email=""
            (goLogin)="router.navigate(['/login'])"
            (resend)="currentStep.set(1)"
          />
        }

      }
    </div>

    @if (currentStep() !== 4) {
      <p class="text-center text-xl sm:text-2xl text-neutral-secondary/85 mt-6">
        Lembrou a senha?
        <a routerLink="/login"
           class="text-xl sm:text-2xl font-semibold text-primary hover:underline ml-1 cursor-pointer">
          Entrar
        </a>
      </p>
    }

  </div>
</div>
