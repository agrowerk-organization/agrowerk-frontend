<div class="max-w-4xl mx-auto relative"> 
    <div class="absolute left-1/2 top-4 bottom-4 w-1 bg-primary/90 -translate-x-1/2 hidden md:block shadow-[0_0_10px_rgba(76,175,80,0.5)]"></div>

    @for (milestone of milestones(); track milestone.year; let i = $index) {
      <div class="flex gap-8 mb-16 last:mb-0 relative z-10" [class.flex-row-reverse]="i % 2 === 1">
        
        <div class="flex-1 text-right" [class.text-left]="i % 2 === 1">
          <div class="inline-block bg-neutral-primary/90 backdrop-blur-md rounded-2xl p-6 border-2 border-primary/70
            hover:scale-105 hover:border-primary/95 transition-all duration-300 shadow-[0_20px_40px_-15px_rgba(76,175,80,0.4)] 
            cursor-pointer">
            <h3 class="text-2xl font-extrabold text-primary mb-2">{{ milestone.title }}</h3>
            <p class="text-xl text-medium text-neutral-secondary">{{ milestone.description }}</p>
          </div>
        </div>

        <div class="flex flex-col items-center">
          <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center text-xl text-neutral-primary
                     font-extrabold shadow-[0_0_20px_rgba(76,175,80,0.5)] border-4 border-neutral-primary">
            {{ milestone.year }}
          </div>
        </div>

        <div class="flex-1"></div>
      </div>
    }
</div>
