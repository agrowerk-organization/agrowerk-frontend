<div class="relative min-h-screen bg-gradient-to-br from-neutral-primary/95 
            to-neutral-primary/90 backdrop-blur-sm rounded-3xl p-8 shadow-2xl">
 
  <app-mesh-gradient class="absolute inset-0 -z-10"></app-mesh-gradient>
  <app-pattern class="absolute inset-0 -z-10"></app-pattern>
  
    @if (loading()) {
      <app-loading-state [loadingIcon]="icons.SPINNER" message="Carregando conteúdo da lei..."></app-loading-state>
    }
  
    @if (error()) {
      <app-error-state [errorIcon]="icons.EXCLAMATION_TRIANGLE" title="Ocorreu um erro" message="Não conseguimos conectar ao servidor" retryText="Tentar novamente"></app-error-state>
    }
  
    @if (lawContent() && !loading()) {
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <app-breadcrumb [icon]="icons.HOME" main="Agrowerk" pageName="Leis" [subPageName]="lawContent()!.slug"></app-breadcrumb>
  
        <div class="animate-fadeInUp mb-10" style="animation-delay: 0.1s;">
          <app-badge [badges]="badges()"></app-badge>
        </div>
  
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <div class="lg:col-span-7 grid grid-cols-1 sm:grid-cols-2 gap-6">
            @for (key of smallMetadata(); track key) {
              <app-glass-card class="min-h-[180px]">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_10px_#4CAF50]"></div>
                  <span class="text-2xl font-black text-primary">{{ getFriendlyLabel(key) }}</span>
                </div>
                <div class="text-neutral-tertiary text-base sm:text-lg font-medium leading-snug" [innerHTML]="formatValue(getMetadataValue(key), key)"></div>
              </app-glass-card>
            }
          </div>
  
          <div class="lg:col-span-5 flex flex-col gap-6">
            @for (key of largeMetadata(); track key) {
              <app-glass-card class="flex-grow">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_10px_#4CAF50]"></div>
                  <span class="text-2xl font-black text-primary">{{ getFriendlyLabel(key) }}</span>
                </div>
                <div class="text-neutral-tertiary text-base sm:text-lg font-medium leading-relaxed" [innerHTML]="formatValue(getMetadataValue(key), key)"></div>
              </app-glass-card>
            }
          </div>
        </div>
  
        <div class="mt-12 relative overflow-hidden rounded-[2.5rem] border border-primary/30 shadow-2xl transition-all duration-700 hover:shadow-primary/5"
             [style.background]="'rgba(13, 20, 15, 0.7)'"
             [style.backdrop-filter]="'blur(40px) saturate(150%)'">
          <div class="p-8 sm:p-12 lg:p-16 relative z-10">
            <div class="law-content prose prose-invert prose-primary max-w-none">
              <div [innerHTML]="sanitizedHtml()"></div>
            </div>
          </div>
        </div>
  
        <div class="mt-10 flex flex-col items-center justify-center rounded-[2.5rem] p-8 lg:p-10 relative overflow-hidden border border-primary/90 shadow-4xl 
            shadow-primary/60 transition-all duration-500 hover:shadow-primary/10 group"
            [style.background]="'rgba(13, 20, 15, 0.8)'"
            [style.backdrop-filter]="'blur(32px) saturate(160%)'">

            <div class="absolute inset-0 opacity-0 group-hover:opacity-5 transition-opacity bg-gradient-to-t from-primary to-transparent pointer-events-none"></div>

            <div class="relative z-10 flex flex-col sm:flex-row gap-6 justify-center w-full">
                <app-button variant="primary" [icon]="icons.PRINT" (onClick)="print()" class="hover:scale-105 transition-transform duration-300">
                    Imprimir
                </app-button>
                <app-button variant="secondary" [icon]="icons.DOWNLOAD" (onClick)="downloadPdf()" class="hover:scale-105 transition-transform duration-300">
                    Baixar PDF
                </app-button>
                <app-button variant="outline" [icon]="icons.ARROW_LEFT" routerLink="/laws" class="hover:scale-105 transition-transform duration-300">
                    Voltar
                </app-button>
            </div>
        </div> 
      </div> 
    } 
    
</div>
