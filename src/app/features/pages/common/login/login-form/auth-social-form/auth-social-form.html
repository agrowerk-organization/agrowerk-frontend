<div class="flex flex-row space-x-3 mb-6 w-full">
    @for (authSocialWay of authSocialWays(); track authSocialWay.id) {
        <button 
            type="button"
            (click)="authSocialWay.action()"
            class="flex-1 flex items-center justify-center space-x-3 px-4 py-3 rounded-xl border border-[var(--color-primary)]/20 
                   bg-[var(--color-primary)]/5 backdrop-blur-md hover:bg-[var(--color-primary)]/10 hover:border-[var(--color-primary)]/40 
                   transition-all duration-300 group shadow-lg shadow-black/20 cursor-pointer"
        >
            <img [ngSrc]="authSocialWay.icon"
                [alt]="authSocialWay.name" 
                width="24"
                height="24"
                class="w-6 h-6 object-contain" 
            />
            <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors"> 
                {{ authSocialWay.name }}
            </span>
        </button>
    }
</div>
