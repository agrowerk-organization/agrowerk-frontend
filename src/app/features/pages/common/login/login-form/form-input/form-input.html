<div>
    <label [for]="id()" class="block text-size-text font-semibold text-[var(--color-neutral-secondary)] mt-4 mb-2">
      {{ label() }}
    </label>
    
    <div class="relative">
      <input
        [id]="id()"
        [type]="type() === 'password' ? (showPassword() ? 'text' : 'password') : type()"
        [formControl]="$any(control())"
        [placeholder]="placeholder()"
        class="w-full px-4 py-3 border-2 border-primary/70 rounded-lg 
              outline-none transition-all duration-200 text-lg
              bg-[var(--color-background)] text-neutral-secondary placeholder-gray-500
              focus:ring-2 focus:ring-[var(--color-primary)]/50 focus:border-[var(--color-primary)]" 
        [class.border-[var(--color-primary)]/30]="!isInvalid"
        [class.border-[var(--color-error)]]="isInvalid"
        [class.pr-12]="type() === 'password'"
      />
      @if (type() === 'password') {
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-3 top-1/2 -translate-y-1/2 
                text-neutral-secondary hover:text-button-main 
                transition-colors duration-200"
          >
          <fa-icon [icon]="showPassword() ? icons.EYE_SLASH : icons.EYE" 
                  class="text-xl" />
        </button>
      }
    </div>
  
    @if (isInvalid) {
      <p class="mt-1 text-lg text-[var(--color-error)] animate-in fade-in slide-in-from-top-1">
        {{ errorMessage() }}
      </p>
    }
</div>
