<div>
    <label [for]="id()" class="block text-size-text font-semibold text-[var(--color-neutral-secondary)] mt-4 mb-2">
      {{ label() }}
    </label>
    
    <div class="relative">
      <input
        [id]="id()"
        [type]="type() === 'password' ? (showPassword() ? 'text' : 'password') : type()"
        [formControl]="$any(control())"
        [placeholder]="placeholder()"
        class="w-full px-4 py-3 border-2 border-primary/70 rounded-lg 
              outline-none transition-all duration-200 
              bg-[var(--color-background)] text-white placeholder-gray-500
              focus:ring-2 focus:ring-[var(--color-primary)]/50 focus:border-[var(--color-primary)]" 
        [class.border-[var(--color-primary)]/30]="!isInvalid"
        [class.border-[var(--color-error)]]="isInvalid"
        [class.pr-12]="type() === 'password'"
      />
      @if (type() === 'password') {
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-[var(--color-primary)] transition-colors"
        >
          <img [src]="showPassword() ? 'assets/svgs/eye-off.svg' : 'assets/svgs/eye.svg'" 
               [alt]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'" class="h-5 w-5" />
        </button>
      }
    </div>
  
    @if (isInvalid) {
      <p class="mt-1 text-xs text-[var(--color-error)] animate-in fade-in slide-in-from-top-1">
        {{ errorMessage() }}
      </p>
    }
</div>
