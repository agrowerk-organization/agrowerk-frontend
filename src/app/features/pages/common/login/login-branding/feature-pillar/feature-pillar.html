<div class="grid grid-cols-1 md:grid-cols-3 gap-10 mt-8">
    @for (pillar of featurePillars(); track pillar.id) {
        <div class="animate-[fadeInUp_1s_ease-out]">
            <div class="card w-[200px] h-full bg-[var(--color-primary)]/10 backdrop-blur-md rounded-2xl p-4 border-2 border-[var(--color-secondary)]/40 shadow-2xl hover:bg-[var(--color-primary)]/30 transition-all duration-500 hover:-translate-y-1">
              <div class="flex flex-col items-center text-center space-y-3">
                <div class="flex-shrink-0 w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                  <img [src]="pillar.icon" alt="" class="w-6 h-6" />
                </div>
                <div class="flex-1">
                  <h3 class="text-title font-bold text-[var(--color-secondary)] leading-tight">{{ pillar.title }}</h3>
                  <p class="flex text-[var(--color-neutral-secondary)]/80 text-size-text mt-1 line-clamp-2 flex-wrap">{{ pillar.description }}</p>
                </div>
              </div>
            </div>
        </div>
    }
</div>
