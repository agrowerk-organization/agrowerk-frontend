<div class="hidden lg:block relative w-14 h-1.5">
     <div class="absolute inset-0 transition-all duration-500 origin-left"
          [ngClass]="isPassed() ? 'bg-primary scale-x-100' : 'bg-neutral-secondary/50 scale-x-100'"></div>
     <div class="absolute right-0 top-1/2 -translate-y-1/2 w-0 h-0 border-l-8 border-t-4 border-b-4 transition-all duration-500"
          [ngClass]="isPassed() ? 'border-l-primary opacity-100' : 'border-l-neutral-secondary/50 opacity-100'">
     </div>
</div>
