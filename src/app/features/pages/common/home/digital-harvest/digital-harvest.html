<section class="relative py-20 overflow-hidden">
    <div class="absolute inset-0 opacity-5">
      <div class="absolute inset-0" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, var(--color-primary) 35px, var(--color-primary) 37px);"></div>
    </div>
  
    <div class="absolute inset-0 pointer-events-none">
      <div class="seed seed-1"></div>
      <div class="seed seed-2"></div>
      <div class="seed seed-3"></div>
      <div class="seed seed-4"></div>
    </div>
  
    <div class="container mx-auto px-4 lg:px-8 relative z-10">
      <div class="text-center mb-16 animate-fadeInUp">

        <app-title
          firstSegment="Do plantio"
          secondSegment="ao lucro"
        ></app-title>
       <app-subtitle text="Otimizamos o seu processo de plantio para otimizar o lucro da sua operação."></app-subtitle>
      </div>
  
      <div class="flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-4 mb-16">
        @for (phase of phases; track phase.id; let i = $index) {
          
          <app-phase-card 
            [phase]="phase" 
            [isActive]="activePhase() === i"
            (select)="selectPhase(i)">
          </app-phase-card>
  
          @if (!$last) {
            <app-phase-connector 
              [isPassed]="activePhase() > i">
            </app-phase-connector>
          }
        }
      </div>
  
      <div class="max-w-6xl mx-auto">
        @if (phases[activePhase()]; as currentPhase) {
          <app-phase-details [phase]="currentPhase"></app-phase-details>
        }
      </div>
  
      <div class="text-center mt-16">
        <p class="text-lg text-neutral-secondary mb-4">
          Pronto para otimizar toda sua operação?
        </p>
        <button class="px-8 py-4 bg-gradient-to-r from-primary to-primary-dark text-neutral-primary text-lg font-bold rounded-full hover:shadow-green-lg transition-all duration-300 hover:scale-105 group">
          Começar Gratuitamente
          <span class="inline-block ml-2 transition-transform duration-300 group-hover:translate-x-2">→</span>
        </button>
      </div>
    </div>
  </section>
