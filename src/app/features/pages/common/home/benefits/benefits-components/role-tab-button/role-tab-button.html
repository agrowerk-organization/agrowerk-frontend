<button
  (click)="clicked.emit()"
  [class]="activeRole() 
    ? 'bg-primary shadow-[0_0_25px_rgba(76,175,80,0.5)] border-primary' 
    : 'bg-neutral-primary/30 border-primary/40 hover:bg-primary/90'"
  class="tab-button px-6 py-1 rounded-3xl font-bold transition-all duration-300 hover:scale-105 flex 
        items-center gap-6 min-w-[300px] cursor-pointer border-2 group"
>
  <div class="w-14 h-14 rounded-2xl flex items-center justify-center bg-white/5 transition-colors"
       [class]="activeRole() ? 'text-white' : 'text-neutral-secondary/60 group-hover:text-white'">
    <fa-icon [icon]="icon()" class="text-3xl"></fa-icon>
  </div>

  <div class="flex flex-col items-start leading-tight">
    <span class="text-2xl tracking-tight transition-colors duration-300"
          [class]="activeRole() ? 'text-white' : 'text-neutral-secondary/80 group-hover:text-white'">
      {{ label() }}
    </span>
    
    <span class="text-xs font-semibold uppercase tracking-[0.2em] transition-colors duration-300"
          [class]="activeRole() ? 'text-white/70' : 'text-neutral-secondary/40 group-hover:text-white/70'">
      {{ activeRole() ? 'Perfil Selecionado' : 'Clique para alternar' }}
    </span>
  </div>
</button>
