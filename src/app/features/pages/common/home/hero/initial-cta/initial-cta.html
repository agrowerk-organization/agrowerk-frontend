<article class="w-full space-y-8">  
  <div class="bg-gradient-to-br from-neutral-primary/95 to-neutral-primary/90 backdrop-blur-sm rounded-3xl p-10 lg:p-12 shadow-2xl animate-fadeInUp border border-primary/60">
      <h1 class="text-[clamp(2.0rem,5vw,3rem)] font-extrabold text-quartenary leading-tight mb-6">
          Sua atividade agrícola
          <span class="block mt-3 bg-gradient-to-r from-secondary via-warning to-secondary 
            bg-clip-text text-transparent"
            style="animation: textPulse 3s ease-in-out infinite; will-change: opacity;">
               mais produtividade
            </span>
      </h1>
      <p class="text-[clamp(1.25rem,3vw,1.5rem)] font-medium text-neutral-secondary leading-relaxed max-w-2xl">
          Planeje sua safra, monitore e otimize seu inventário e troque insumos e outros produtos de acordo com o planejamento de sua produção.
      </p>
  </div>
  
  <div class="animate-fadeInUp" style="animation-delay: 0.1s;">
      <app-badge [badges]="badges"></app-badge>
  </div>
  
  <div class="animate-fadeInUp" style="animation-delay: 0.2s;">
      <app-steps [steps]="steps"></app-steps>
  </div>
  
  <div class="animate-fadeInUp" style="animation-delay: 0.3s;">
      <app-actions [width]="'400px'" mobileWidth="'320px" [actions]="actions"></app-actions>
  </div>
  
  <div class="animate-fadeInUp" style="animation-delay: 0.4s;">
      <app-trust [trusts]="trusts"></app-trust>
  </div>
</article>
