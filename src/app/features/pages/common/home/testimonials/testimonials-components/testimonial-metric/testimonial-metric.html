<div class="metric-badge flex flex-col items-center justify-center gap-2 rounded-2xl px-8 py-6 border"
     [ngClass]="[styles().bg, styles().border, styles().shadow]">

  @if (icon()) {
    <fa-icon [icon]="icon()" class="text-2xl" [ngClass]="styles().icon"></fa-icon>
  }

  <p class="text-xs uppercase tracking-widest font-semibold text-neutral-400">{{ label() }}</p>

  <p class="text-3xl font-bold leading-tight" [ngClass]="styles().text">{{ value() }}</p>

</div>
