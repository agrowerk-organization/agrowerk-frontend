<div class="stat-card group flex flex-col items-center justify-center rounded-3xl p-4 lg:p-6 relative overflow-hidden 
            w-full max-w-[300px] min-h-[220px] lg:min-h-[250px] transition-all duration-500 hover:-translate-y-2 
            hover:scale-105 hover:shadow-2xl border-2 border-primary/60"
     [class]="'hover:border-' + stat().color + '/80'"
     [style.background]="'rgba(13, 20, 15, 0.9)'"
     [style.backdrop-filter]="'blur(24px) saturate(160%)'"
     [style.box-shadow]="'
        0 8px 12px rgba(76,175,80,0.3),
        0 0 0 1px rgba(76,175,80,0.15),
        inset 0 1px 0 rgba(255,255,255,0.05)
        '">
    <div class="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity bg-gradient-to-br"
         [ngClass]="'from-' + stat().color"></div>
  
    <div class="relative mb-6">
      <div class="w-16 h-16 rounded-full flex items-center justify-center ..."
           [ngClass]="'bg-' + stat().color + '/40'">
        <fa-icon [icon]="stat().icon" [ngClass]="'text-6xl text-' + stat().color"></fa-icon>
      </div>
    </div>
  
    <div class="relative flex flex-col items-center">
      <app-counter [targetValue]="stat().value" 
      [prefix]="stat().prefix || ''" 
      [suffix]="stat().suffix || ''"
      ></app-counter>
      <p class="text-xl text-quartenary">{{ stat().label }}</p>
  
      @if (stat().trend) {
        <app-stat-trend [trend]="stat().trend!"></app-stat-trend>
      }
    </div>
</div>
