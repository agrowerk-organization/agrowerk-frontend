<div class="group relative overflow-hidden rounded-3xl mb-6
            bg-neutral-primary border-3 border-primary/70
            shadow-xl shadow-primary/30
            transition-all duration-300 hover:border-primary hover:shadow-xl hover:-translate-y-1
            animate-fadeInUp">

  <div class="absolute inset-0 -z-10 pointer-events-none overflow-hidden">
    <div class="absolute top-0 right-0 w-72 h-72 bg-primary/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-10 -left-10 w-48 h-48 bg-emerald-700/10 rounded-full blur-2xl"></div>
  </div>

  <div class="relative z-10 p-8 flex flex-col sm:flex-row items-center sm:items-end gap-6">

    <app-avatar-upload
      [avatarUrl]="profile().avatarUrl"
      [avatarPreview]="avatarPreview()"
      [name]="profile().name"
      [uploading]="uploading()"
      (fileSelected)="fileSelected.emit($event)" />

    <div class="flex-1 text-center sm:text-left">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-secondary leading-tight">
        {{ profile().name }}
      </h1>
      <p class="text-neutral-secondary mt-1 text-lg">{{ profile().email }}</p>

      <div class="flex flex-wrap justify-center sm:justify-start gap-3 mt-3">

        <span class="flex items-center gap-1.5 text-xl sm:text-2xl font-semibold px-3 py-1 rounded-full
                     border border-primary/40 text-primary/80">
          <fa-icon [icon]="icons.CALENDAR" class="text-xl sm:text-2xl" />
          Produtor desde {{ profile().createdAt | date:'MMM yyyy' }}
        </span>

        @if (profile().emailVerified) {
          <span class="flex items-center gap-1.5 text-xl sm:text-2xl font-semibold px-3 py-1 rounded-full
                       border border-emerald-500/40 text-emerald-400">
            <fa-icon [icon]="icons.CHECK_CIRCLE" class="text-xl sm:text-2xl" />
            E-mail verificado
          </span>
        } @else {
          <span class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full
                       border border-yellow-500/40 text-yellow-400">
            <fa-icon [icon]="icons.TIMES_CIRCLE" class="text-xs" />
            E-mail não verificado
          </span>
        }

        @if (profile().mfaEnabled) {
          <span class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full
                       border border-emerald-500/40 text-emerald-400">
            <fa-icon [icon]="icons.SHIELD" class="text-xs" />
            2FA ativo
          </span>
        }

      </div>
    </div>
  </div>
</div>
