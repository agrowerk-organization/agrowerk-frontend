<div class="group relative overflow-hidden rounded-3xl
            bg-neutral-primary border-3 border-primary/70
            shadow-xl shadow-primary/30
            transition-all duration-300 hover:border-primary hover:shadow-xl hover:-translate-y-1
            animate-fadeInUp">

  <div class="absolute inset-0 -z-10 pointer-events-none overflow-hidden">
    <div class="absolute top-0 right-0 w-40 h-40 bg-primary/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 p-8">

    <div class="flex items-center gap-3 mb-6">
      <div class="w-16 h-8 sm:w-16 h-16 rounded-xl bg-gradient-to-br from-emerald-900 to-green-950
                  flex items-center justify-center
                  shadow-lg group-hover:scale-110 transition-transform duration-300">
        <fa-icon [icon]="icons.SHIELD" class="text-primary text-4xl" />
      </div>
      <h3 class="text-2xl sm:text-4xl font-bold text-primary">Segurança</h3>
    </div>

    <ul class="space-y-3">

      <li class="flex items-center justify-between p-3 rounded-xl
                 border-2 border-primary/50 hover:border-primary/95 transition-colors">
        <div class="flex items-center gap-3">
          <fa-icon [icon]="icons.KEY" class="text-primary/60 w-8 text-2xl" />
          <div>
            <p class="text-xl sm:text-2xl text-neutral-secondary font-medium">Senha</p>
            <p class="text-xl sm:text-2xl text-neutral-secondary">
              Alterada em {{ profile().lastPasswordChange | date:'dd/MM/yyyy' }}
            </p>
          </div>
        </div>
        <button routerLink="/producer/profile/change-password"
                class="text-xl sm:text-2xl font-bold text-primary border border-primary/40 px-3 py-1.5
                       rounded-lg hover:bg-primary/10 transition-all cursor-pointer">
          Alterar
        </button>
      </li>

      <li class="flex items-center justify-between p-3 rounded-xl
                 border-2 border-primary/50 hover:border-primary/95 transition-colors">
        <div class="flex items-center gap-3">
          <fa-icon [icon]="icons.MOBILE" class="text-primary/60 w-5 text-2xl" />
          <div>
            <p class="text-xl sm:text-2xl text-neutral-secondary font-medium">Autenticação em 2 fatores</p>
            <p class="text-xl sm:text-2xl" [class]="profile().mfaEnabled ? 'text-emerald-400' : 'text-yellow-400'">
              {{ profile().mfaEnabled ? 'Ativado' : 'Desativado' }}
            </p>
          </div>
        </div>
        <button routerLink="/producer/profile/mfa"
                class="text-xl sm:text-2xl font-bold text-primary border border-primary/40 px-3 py-1.5
                       rounded-lg hover:bg-primary/10 transition-all cursor-pointer">
          {{ profile().mfaEnabled ? 'Gerenciar' : 'Ativar' }}
        </button>
      </li>

      <li class="flex items-center gap-4 p-3 rounded-xl border-2 border-primary/50 hover:border-primary/95 transition-colors">
        <fa-icon [icon]="icons.CLOCK" class="text-primary/60 w-5 text-2xl" />
        <div>
          <p class="text-xl sm:text-2xl text-neutral-secondary font-medium">Último acesso</p>
          <p class="text-lg sm:text-xl text-neutral-secondary">
            {{ profile().lastLogin | date:'dd/MM/yyyy HH:mm' }}
          </p>
        </div>
      </li>

    </ul>
  </div>
</div>
