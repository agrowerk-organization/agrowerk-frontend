<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
         (click)="toCancel.emit()"
         (keydown.escape)="toCancel.emit()"
         tabindex="-1" role="presentation"></div>
  
    <div class="relative z-10 w-full mt-8 max-w-xl max-h-[85vh] flex flex-col rounded-3xl
                bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">
  
      <div class="flex items-center justify-between p-6 border-b border-primary/30">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">
            {{ isEdit() ? 'Editar Armazém' : 'Novo Armazém' }}
          </h2>
          @if (isEdit()) {
            <p class="text-secondary/80 text-lg italic">{{ warehouseData()!.name }}</p>
          }
        </div>
        <button type="button" (click)="toCancel.emit()"
                class="w-12 h-12 flex items-center justify-center rounded-xl border-2 border-primary/30
                       text-primary hover:border-primary transition-all cursor-pointer">
          <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
        </button>
      </div>
  
      <div class="overflow-y-auto flex-1">
        <form id="warehouseForm" class="p-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="sm:col-span-2">
              <label for="wh-name" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Nome *
              </label>
              <input id="wh-name" formControlName="name" type="text" placeholder="Ex: Silo Principal"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary
                            focus:border-primary outline-none transition-all" />
            </div>
            <div>
              <label for="wh-code" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
                Código
              </label>
              <input id="wh-code" formControlName="code" type="text" placeholder="Ex: S-01"
                     class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                            bg-transparent text-lg text-neutral-secondary
                            focus:border-primary outline-none transition-all" />
            </div>
          </div>
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-select-field
              label="Tipo de Armazém *"
              fieldId="wh-type"
              [options]="typeOptions"
              formControlName="warehouseType" />
  
            <app-number-field
              label="Capacidade (kg)"
              fieldId="wh-capacity"
              [min]="1"
              [step]="100"
              formControlName="capacityKg" />
          </div>
  
          <div>
            <label for="wh-location" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
              Localização
            </label>
            <input id="wh-location" formControlName="location" type="text"
                   placeholder="Ex: Galpão norte, próximo ao curral"
                   class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                          bg-transparent text-lg text-neutral-secondary
                          focus:border-primary outline-none transition-all" />
          </div>
  
          <div>
            <label for="wh-desc" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
              Descrição
            </label>
            <textarea id="wh-desc" formControlName="description" rows="2"
                      placeholder="Observações sobre o armazém..."
                      class="w-full px-4 py-3 rounded-2xl border-2 border-primary/90
                             bg-transparent text-lg text-neutral-secondary
                             focus:border-primary outline-none transition-all resize-none"></textarea>
          </div>
  
        </form>
      </div>
  
      <div class="p-6 border-t border-primary/30 flex flex-col sm:flex-row gap-3">
        <app-button-pages text="Cancelar" [icon]="icons.CIRCLE_XMARK" width="100%" (action)="toCancel.emit()" />
        <app-button-pages
          [text]="saving() ? 'Salvando...' : (isEdit() ? 'Salvar Alterações' : 'Criar Armazém')"
          [icon]="saving() ? icons.SPINNER : (isEdit() ? icons.PEN : icons.PLUS)"
          [disabled]="saving() || form.invalid"
          width="100%"
          (action)="submit()" />
      </div>
  
    </div>
</div>
