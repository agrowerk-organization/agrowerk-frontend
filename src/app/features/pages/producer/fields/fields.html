@if (loading()) {
    <div class="flex items-center justify-center h-[calc(100vh-100px)]">
      <div class="animate-spin w-10 h-10 rounded-full border-4
                  border-button-main border-t-transparent"></div>
    </div>
  } @else {
    <div class="p-6 space-y-6 pb-32 lg:pb-6 max-w-9xl mx-auto px-4 sm:px-10">
  
      <div class="flex items-center gap-4">
        <app-back-button [link]="'/producer/properties/' + propertyId() + '/seasons'" />
  
        <div class="flex-1 flex items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl sm:text-3xl font-black text-primary uppercase tracking-tight leading-none">
              Talhões
            </h1>
            <div class="flex flex-col sm:flex-row items-center gap-2">
              <p class="text-secondary/97 text-xl sm:text-2xl italic mt-1">{{ propertyName() }}</p>
              <span class="text-secondary/97 text-xl sm:text-2xl font-bold italic mt-1"> - </span>
              <p class="text-secondary/97 text-xl sm:text-2xl italic mt-1">{{ seasonName() }}</p>
            </div>
          </div>  
  
          <app-button-pages
            text="Novo Talhão"
            [icon]="icons.PLUS"
            (action)="openCreate()" />
        </div>
      </div>
  
      @if (hasItems()) {
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
          @for (field of fields(); track field.id) {
            <app-field-card
              [field]="field"
              (newPlanting)="goToPlanting($event)"
              (edit)="openEdit($event)" />
          }
        </div>
  
        @if (total() > 1) {
          <app-paginator
            [currentPage]="currentPage()"
            [totalPages]="total()"
            (pageChange)="onPageChange($event)" />
        }
  
      } @else {
        <div class="flex flex-col items-center justify-center py-24 gap-6">
          <div class="w-24 h-24 rounded-3xl bg-black/20 border-2 border-primary/90
                      flex items-center justify-center">
            <fa-icon [icon]="icons.LAYER_GROUP" class="text-5xl text-primary/90" />
          </div>
          <div class="text-center">
            <p class="text-primary/90 font-black text-xl uppercase tracking-widest">
              Nenhum talhão cadastrado
            </p>
            <p class="text-secondary/90 text-base sm:text-lg mt-2">
              Cadastre o primeiro talhão desta propriedade.
            </p>
          </div>
          <app-button-pages
            text="Cadastrar Talhão"
            [icon]="icons.PLUS"
            (action)="openCreate()" />
        </div>
      }
  
    </div>
}
  
@if (showForm()) {
    <app-field-form
      [propertyId]="propertyId()"
      [fieldData]="editTarget()"
      (saved)="onSaved($event)"
      (toCancel)="closeForm()" />
}
