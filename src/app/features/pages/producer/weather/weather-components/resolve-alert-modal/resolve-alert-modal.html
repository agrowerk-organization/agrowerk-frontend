<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
         (click)="toCancel.emit()"
         (keydown.escape)="toCancel.emit()"
         tabindex="-1"
         role="presentation"></div>
  
    <div class="relative z-10 w-full mt-8 max-w-xl flex flex-col rounded-3xl
                bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">
  
      <div class="flex items-center justify-between p-6 border-b border-primary/30">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">
            Resolver Alerta
          </h2>
          <p class="text-neutral-secondary text-base sm:text-lg mt-0.5 italic">
            {{ alertTitle() }}
          </p>
        </div>
        <button type="button" (click)="toCancel.emit()"
                class="w-12 h-12 flex items-center justify-center rounded-xl border-2
                       border-primary/30 text-primary hover:border-primary transition-all cursor-pointer">
          <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
        </button>
      </div>
  
      <div class="p-6">
        <label for="observations"
               class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-2 block">
          O que foi feito?
          <span class="text-sm font-normal text-neutral-secondary/60 ml-1">(opcional)</span>
        </label>
        <textarea id="observations"
                  [formControl]="observationsControl"
                  placeholder="Ex: Irrigação ajustada manualmente, plantas cobertas com manta térmica..."
                  rows="4"
                  class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                         bg-transparent text-lg sm:text-xl text-neutral-secondary
                         focus:border-primary outline-none transition-all resize-none">
        </textarea>
      </div>
  
      <div class="w-full flex justify-center p-6 border-t border-primary/30 flex flex-col sm:flex-row gap-3">
        <app-button-pages
          text="Cancelar"
          [icon]="icons.CIRCLE_XMARK"
          width="100%"
          (action)="toCancel.emit()" />
  
        <app-button-pages
          [text]="saving() ? 'Resolvendo...' : 'Confirmar'"
          [icon]="saving() ? icons.SPINNER : icons.CHECK"
          [disabled]="saving()"
          width="100%"
          (action)="submit()" />
      </div>
    </div>
</div>
