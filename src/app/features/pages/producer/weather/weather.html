@if (loading()) {
    <div class="flex items-center justify-center h-[calc(100vh-100px)]">
      <div class="animate-spin w-12 h-12 rounded-full
                  border-4 border-button-main border-t-transparent">
      </div>
    </div>
  }
  @else if (weatherDashboard(); as dash) {

    @if (resolvingAlert(); as alert) {
      <app-resolve-alert-modal
        [alertId]="alert.id"
        [alertTitle]="alert.title"
        (toCancel)="resolvingAlert.set(null)"
        (toResolved)="onAlertResolved()" />
    }

    <div class="p-8 space-y-8 pb-32 lg:pb-6 max-w-none mx-auto px-4 sm:px-10">
  
      <div class="flex items-center gap-4">
        <a routerLink="/producer/dashboard"
           class="flex items-center justify-center w-10 h-10 sm:w-14 sm:h-14 rounded-xl border-2 border-primary/50 hover:border-primary text-primary transition-all duration-300">
          <fa-icon [icon]="icons.ARROW_LEFT" class="text-lg sm:text-2xl" />
        </a>
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold text-primary">Clima & Monitoramento</h1>
          <p class="text-secondary text-xl sm:text-2xl mt-0.5">Previsões e alertas para sua propriedade</p>
        </div>
      </div>
  
      <app-property-selector
        [properties]="properties()"
        [activePropertyId]="activeProperty()?.id ?? ''"
        (propertyChange)="onPropertyChange($event)" />
  
      @if ((dash.activeAlerts ?? []).length > 0) {
        <app-weather-alerts-card
          [alerts]="dash.activeAlerts ?? []"
          [canResolve]="true"
          (resolve)="onResolveAlert($event)" />
      }

      <div class="grid grid-cols-1 py-4 lg:grid-cols-5 gap-8 items-start">
        <div class="lg:col-span-2">
          <app-weather-card [current]="dash.current" />
        </div>
        <div class="lg:col-span-3">
          <app-forecast-card [forecast]="dash.dailyForecast" />
        </div>
      </div>
  
      <div class="grid grid-cols-1 gap-8">
        <div class="group relative overflow-hidden rounded-3xl bg-neutral-primary border-3 border-primary/70 shadow-xl shadow-primary/30 p-8 w-full">
          <div class="absolute inset-0 -z-10 pointer-events-none overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
          </div>
          <h2 class="text-3xl font-bold text-primary mb-8 flex items-center gap-3">
            <fa-icon [icon]="icons.CHART_LINE" />
            Análise de Solo e Acumulados
          </h2>
          <app-statistics-card [statistics]="dash.statistics" />
        </div>
      </div>
  
    </div>
  }
  @else {
    <div class="flex flex-col items-center justify-center h-[calc(100vh-100px)] gap-3">
      <fa-icon [icon]="icons.CLOUD_SUN_RAIN" class="text-5xl text-neutral-secondary opacity-30" />
      <p class="text-neutral-secondary font-medium">Dados climáticos indisponíveis no momento</p>
    </div>
  }
