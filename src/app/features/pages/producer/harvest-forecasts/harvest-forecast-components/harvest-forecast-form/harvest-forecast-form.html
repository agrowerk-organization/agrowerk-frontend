<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
         (click)="toCancel.emit()"
         (keydown.escape)="toCancel.emit()"
         tabindex="-1" role="presentation"></div>
  
    <div class="relative z-10 w-full max-w-2xl mt-8 max-h-[85vh] flex flex-col rounded-3xl
                bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">

      <div class="flex items-center justify-between p-6 border-b border-primary/30">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">
            {{ isEdit() ? 'Editar Previsão' : 'Nova Previsão de Safra' }}
          </h2>
          @if (cropVarietyName()) {
            <p class="text-secondary/80 text-lg italic mt-0.5">
              {{ cropName() }} — {{ cropVarietyName() }}
            </p>
          }
        </div>
        <button type="button" (click)="toCancel.emit()"
                class="w-12 h-12 flex items-center justify-center rounded-xl border-2 border-primary/30
                       text-primary hover:border-primary transition-all cursor-pointer">
          <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
        </button>
      </div>
  
      <div class="overflow-y-auto flex-1">
        <form id="forecastForm" class="p-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-number-field
              label="Quantidade Estimada (kg) *"
              fieldId="estimated-qty"
              [min]="0.001"
              [step]="1"
              formControlName="estimatedQuantity" />
  
            <app-number-field
              label="Área Plantada (ha)"
              fieldId="planted-area"
              [min]="0.01"
              [step]="0.1"
              formControlName="plantedArea" />
          </div>
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-date-field
              label="Data da Previsão *"
              fieldId="forecast-date"
              formControlName="forecastDate" 
              [disablePast]="true" />
  
            <app-select-field
              label="Nível de Confiança *"
              fieldId="confidence-level"
              [options]="confidenceOptions"
              formControlName="confidenceLevel" />
          </div>
  
          <div>
            <label for="forecast-notes" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
              Observações
            </label>
            <textarea id="forecast-notes" formControlName="notes" rows="3"
                      placeholder="Condições climáticas, fatores de risco, metodologia..."
                      class="w-full px-4 py-3 rounded-2xl border-2 border-primary/90
                             bg-transparent text-lg text-neutral-secondary
                             focus:border-primary outline-none transition-all resize-none"></textarea>
          </div>
  
        </form>
      </div>
  
      <div class="p-6 border-t border-primary/30 flex flex-col sm:flex-row items-center justify-center gap-3">
        <app-button-pages
          text="Cancelar"
          [icon]="icons.CIRCLE_XMARK"
          width="100%"
          (action)="toCancel.emit()" />
        <app-button-pages
          [text]="saving() ? 'Salvando...' : (isEdit() ? 'Salvar Alterações' : 'Criar Previsão')"
          [icon]="saving() ? icons.SPINNER : (isEdit() ? icons.PEN : icons.PLUS)"
          [disabled]="saving() || form.invalid"
          width="100%"
          (action)="submit()" />
      </div>
  
    </div>
</div>
