<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
         (click)="toCancel.emit()"
         (keydown.escape)="toCancel.emit()"
         tabindex="-1"
         role="presentation"></div>
  
    <div class="relative z-10 w-full mt-8 max-w-xl max-h-[85vh] flex flex-col rounded-3xl
                bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">
  
      <div class="flex items-center justify-between p-6 border-b border-primary/30">
        <h2 class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">
          Registrar Insumo
        </h2>
        <button type="button" (click)="toCancel.emit()"
                class="w-12 h-12 flex items-center justify-center rounded-xl border-2 border-primary/30
                       text-primary hover:border-primary transition-all cursor-pointer">
          <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
        </button>
      </div>
  
      <!-- Body -->
      <div class="overflow-y-auto flex-1">
        <form id="plantingInputForm" class="p-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  
          <div>
            <label for="name" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-2 block">
              Insumo *
            </label>
  
            <button type="button"
                    (click)="pickerOpen.set(!pickerOpen())"
                    class="w-full flex items-center justify-between gap-3 px-4 py-4 rounded-2xl
                           border-2 border-primary/90 bg-transparent text-neutral-secondary
                           hover:border-primary transition-all cursor-pointer">
              @if (selectedInput(); as inp) {
                <div class="flex items-center gap-3">
                  <fa-icon [icon]="icons.FLASK" class="text-primary" />
                  <span class="text-lg font-bold">{{ inp.name }}</span>
                </div>
              } @else {
                <span class="text-secondary/40 text-lg">Selecione um insumo...</span>
              }
              <fa-icon [icon]="icons.CHEVRON_DOWN" class="text-primary/60 text-sm transition-transform"
                       [class.rotate-180]="pickerOpen()" />
            </button>
  
            @if (pickerOpen()) {
              <div class="mt-2 rounded-2xl border-2 border-primary/30 bg-black/20 max-h-48 overflow-y-auto">
                @for (inp of inputs(); track inp.id) {
                  <button type="button"
                          (click)="selectInput(inp)"
                          class="w-full flex items-center gap-3 px-4 py-3 transition-all cursor-pointer border-b border-primary/10 last:border-0"
                          [class]="selectedInput()?.id === inp.id
                            ? 'bg-primary/10 text-primary'
                            : 'hover:bg-primary/5 text-secondary'">
                    <fa-icon [icon]="icons.FLASK" class="text-sm text-primary/50 shrink-0" />
                    <div class="text-left">
                      <p class="text-sm font-bold">{{ inp.name }}</p>
                      @if (inp.categoryId) {
                        <p class="text-xs text-secondary/50">{{ inp.categoryId }}</p>
                      }
                    </div>
                  </button>
                }
              </div>
            }
          </div>
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-select-field
              label="Unidade de Medida *"
              fieldId="unit-of-measure"
              [options]="unitOptions"
              formControlName="unitOfMeasure" />
  
            <app-number-field
              label="Quantidade *"
              fieldId="quantity"
              [min]="0.001"
              [step]="0.1"
              formControlName="quantity" />
          </div>
  
          <div>
            <label for="application-date" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
              Data de Aplicação *
            </label>
            <input id="application-date" formControlName="applicationDate" type="date"
                   class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                          bg-transparent text-lg text-neutral-secondary
                          focus:border-primary outline-none transition-all" />
          </div>
  
        </form>
      </div>
  
      <div class="p-6 border-t border-primary/30 flex flex-col sm:flex-row gap-3">
        <app-button-pages
          text="Cancelar"
          [icon]="icons.CIRCLE_XMARK"
          width="100%"
          (action)="toCancel.emit()" />
  
        <app-button-pages
          [text]="saving() ? 'Salvando...' : 'Registrar Insumo'"
          [icon]="saving() ? icons.SPINNER : icons.PLUS"
          [disabled]="saving() || form.invalid"
          width="100%"
          (action)="submit()" />
      </div>
  
    </div>
</div>
