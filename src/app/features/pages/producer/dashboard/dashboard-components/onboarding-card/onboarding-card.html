<div class="p-6 max-w-5xl mx-auto">

  <div class="text-center mb-8">
    <app-title [firstSegment]="'Bem-vindo ao'" [secondSegment]="'AgroWerk'"></app-title>

    <app-subtitle [text]="'O melhor sistema integrado de gestão empresarial para o agronegócio brasileiro'"></app-subtitle>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-8">
    @for (feature of features; track feature.label) {
      <div class="group relative overflow-hidden rounded-3xl bg-neutral-primary
                  border-3 border-primary/80 hover:border-primary
                  transition-all duration-300 hover:-translate-y-1
                  shadow-2xl shadow-primary/80 p-6">
        <div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-button-main to-button-second
                      flex items-center justify-center mb-3
                      group-hover:scale-110 transition-transform duration-300
                      border-2 border-primary/80">
            <fa-icon [icon]="feature.icon" class="text-xl sm:text-2xl text-neutral-primary" />
          </div>
          <p class="font-bold text-primary text-lg sm:text-2xl mb-1">{{ feature.label }}</p>
          <p class="text-neutral-secondary/90 text-lg sm:text-xl leading-relaxed">{{ feature.description }}</p>
        </div>
      </div>
    }
  </div>

  <div class="group relative overflow-hidden rounded-3xl bg-neutral-primary
              border-3 border-primary/50 hover:border-primary 
              transition-all duration-300 shadow-2xl shadow-primary/80 p-7">
    <div class="absolute top-0 right-0 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="relative z-10 flex items-center justify-between gap-6 flex-wrap">
      <div>
        <p class="text-2xl sm:text-3xl font-bold text-neutral-secondary mb-1">Pronto para começar?</p>
        <p class="text-xl sm:text-2xl text-neutral-secondary/60 text-sm">Leva menos de 2 minutos para cadastrar sua primeira propriedade.</p>
      </div>
      <app-button-pages
        text="Cadastrar propriedade"
        [icon]="icons.ARROW_RIGHT"
        width="full"
        (action)="handleAction()" />
    </div>
  </div>

</div>
