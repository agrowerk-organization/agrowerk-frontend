<div class="flex flex-col items-center justify-center
            h-64 gap-6 text-center">

  <fa-icon [icon]="icons.SEEDLING"
           class="text-6xl text-button-main opacity-50" />

  <div>
    <app-title [firstSegment]="'Bem-vindo'" [secondSegment]="'ao AgroWerk'"></app-title>

    <app-subtitle [text]="'Crie sua primeira propriedade para comecar.'"></app-subtitle>

  </div>

    <app-button-pages 
            [text]="'Começar Agora'"
            [action]="handleAction"
            [icon]="icons.ARROW_RIGHT">
    </app-button-pages>

  <a routerLink="/producer/properties/create"
     class="px-6 py-3 bg-button-main text-white rounded-lg
            font-semibold hover:bg-button-main-hover transition-all">
    Cadastrar propriedade
  </a>
</div>
