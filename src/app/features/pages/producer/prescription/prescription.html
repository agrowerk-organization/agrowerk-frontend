@if (loading()) {
    <div class="flex items-center justify-center h-[calc(100vh-100px)]">
      <div class="animate-spin w-10 h-10 rounded-full border-4 border-button-main border-t-transparent"></div>
    </div>
  } @else {
    <div class="p-6 space-y-6 pb-32 lg:pb-6 max-w-9xl mx-auto px-4 sm:px-10">
  
      <div class="flex items-center gap-4">
        <app-back-button [link]="backLink" />
  
        <div class="flex-1 flex items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl sm:text-3xl font-black text-primary uppercase tracking-tight leading-none">
              Receitas Agronômicas
            </h1>
            <p class="text-secondary text-xl sm:text-2xl italic mt-1">{{ subtitle }}</p>
          </div>
          <app-button-pages
            text="Nova Receita"
            [icon]="icons.PLUS"
            (action)="showForm.set(true)" />
        </div>
      </div>
  
      @if (hasItems()) {
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
          @for (prescription of prescriptions(); track prescription.id) {
            <app-prescription-card
              [prescription]="prescription"
              (deactivate)="onDeactivate($event)" />
          }
        </div>
  
      } @else {
        <div class="flex flex-col items-center justify-center py-24 gap-6">
          <div class="w-24 h-24 rounded-3xl bg-black/20 border-2 border-primary/90
                      flex items-center justify-center">
            <fa-icon [icon]="icons.FILE_CONTRACT" class="text-5xl text-primary/90" />
          </div>
          <div class="text-center">
            <p class="text-primary/90 font-black text-xl uppercase tracking-widest">
              Nenhuma receita cadastrada
            </p>
            <p class="text-secondary/90 text-sm sm:text-lg mt-2">
              Registre a primeira receita agronômica para este plantio.
            </p>
          </div>
          <app-button-pages
            text="Criar Receita"
            [icon]="icons.PLUS"
            (action)="showForm.set(true)" />
        </div>
      }
  
    </div>
}
  
@if (showForm()) {
    <app-prescription-form
      [plantingId]="plantingId()"
      [cropVarietyName]="cropVarietyName()"
      [cropName]="cropName()"
      (saved)="onSaved($event)"
      (toCancel)="showForm.set(false)" />
}
