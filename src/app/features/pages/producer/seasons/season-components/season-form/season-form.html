<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
         (click)="toCancel.emit()"
         (keydown.escape)="toCancel.emit()"
         tabindex="-1"
         role="presentation"></div>
  
    <div class="relative z-10 w-full mt-8 max-w-lg max-h-[85vh] flex flex-col rounded-3xl
                bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">
  
      <div class="flex items-center justify-between p-6 border-b border-primary/30 bg-neutral-primary">
        <h2 class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">
          Nova Safra
        </h2>
        <button type="button" (click)="toCancel.emit()"
                class="w-12 h-12 flex items-center justify-center rounded-xl border-2 border-primary/30
                       text-primary hover:border-primary transition-all cursor-pointer">
          <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
        </button>
      </div>
  
      <div class="overflow-y-auto flex-1">
        <form id="seasonForm" class="p-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  
          <div class="flex items-start gap-3 p-4 rounded-2xl border-2 border-amber-400/50 bg-amber-400/5">
            <fa-icon [icon]="icons.TRIANGLE_EXCLAMATION" class="text-amber-400 text-lg mt-0.5 shrink-0" />
            <p class="text-sm text-secondary/80 leading-relaxed">
              <span class="text-lg font-black text-amber-400 uppercase tracking-wide">Atenção: </span>
              os dados da safra <span class="text-sm font-bold">não poderão ser alterados</span> após a criação.
              Verifique as informações antes de confirmar.
            </p>
          </div>
  
          <div>
            <label for="season-name" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">
              Nome da Safra *
            </label>
            <input id="season-name" formControlName="name" type="text"
                   placeholder="Ex: Safra Milho 2025/1"
                   class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90
                          bg-transparent text-lg sm:text-xl text-neutral-secondary
                          focus:border-primary outline-none transition-all" />
          </div>
  
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-date-field
              label="Data de Início *"
              fieldId="start-date"
              formControlName="startDate" />
          
            <app-date-field
              label="Data de Término *"
              fieldId="end-date"
              formControlName="endDate" />
          </div>
  
        </form>
      </div>
  
      <div class="p-6 border-t border-primary/30 bg-neutral-primary flex flex-col sm:flex-row gap-3">
        <app-button-pages
          text="Cancelar"
          [icon]="icons.CIRCLE_XMARK"
          width="100%"
          (action)="toCancel.emit()" />
  
        <app-button-pages
          [text]="saving() ? 'Salvando...' : 'Confirmar Safra'"
          [icon]="saving() ? icons.SPINNER : icons.PLUS"
          [disabled]="saving() || form.invalid"
          width="100%"
          (action)="submit()" />
      </div>
  
    </div>
</div>
