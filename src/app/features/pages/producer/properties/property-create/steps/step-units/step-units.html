<h2 class="text-xl font-bold text-primary mb-2">Talhões</h2>
<p class="text-neutral-secondary text-sm mb-6">Opcional — você pode adicionar depois.</p>

<div class="space-y-4">
  @for (unit of units().controls; track $index; let i = $index) {
    <div [formGroup]="group(i)"
         class="rounded-2xl border-2 border-primary/40 p-5 space-y-3">

      <div class="flex items-center justify-between">
        <span class="text-primary font-semibold">Talhão {{ i + 1 }}</span>
        <button type="button" (click)="removeUnit(i)"
                class="text-red-400 hover:text-red-300 transition-colors">
          <fa-icon [icon]="icons.TRASH" />
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="sm:col-span-2">
          <label [attr.for]="'unit-name-' + i" class="text-sm text-neutral-secondary mb-1 block">Nome *</label>
          <input [id]="'unit-name-' + i" formControlName="name" type="text" placeholder="Ex: Talhão A"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                        bg-transparent text-primary placeholder:text-neutral-secondary/50
                        focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-area-' + i" class="text-sm text-neutral-secondary mb-1 block">Área (ha) *</label>
          <input [id]="'unit-area-' + i" formControlName="area" type="number" min="0" step="0.01"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                        bg-transparent text-primary focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-code-' + i" class="text-sm text-neutral-secondary mb-1 block">CEP *</label>
          <input [id]="'unit-code-' + i" formControlName="code" type="text"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                        bg-transparent text-primary focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-muni-' + i" class="text-sm text-neutral-secondary mb-1 block">Município *</label>
          <input [id]="'unit-muni-' + i" formControlName="municipality" type="text"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                        bg-transparent text-primary focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-loc-' + i" class="text-sm text-neutral-secondary mb-1 block">Localidade</label>
          <input [id]="'unit-loc-' + i" formControlName="locationName" type="text"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                        bg-transparent text-primary focus:border-primary outline-none transition-all" />
        </div>

        <div class="sm:col-span-2 flex items-center justify-between p-3 rounded-xl border-2 border-primary/30">
          <span class="text-primary text-sm font-medium">Zona rural</span>
          <button type="button" (click)="toggleRural(i)" aria-label="Alternar zona rural">
            <fa-icon [icon]="group(i).value.rural ? icons.TOGGLE_ON : icons.TOGGLE_OFF"
                     class="text-2xl transition-colors duration-300"
                     [class.text-primary]="group(i).value.rural"
                     [class.text-neutral-secondary]="!group(i).value.rural" />
          </button>
        </div>
      </div>
    </div>
  }

  <button type="button" (click)="addUnit()"
          class="w-full py-3 rounded-xl border-2 border-dashed border-primary/40
                 text-primary font-semibold hover:border-primary
                 flex items-center justify-center gap-2 transition-all duration-300">
    <fa-icon [icon]="icons.PLUS" />
    Adicionar talhão
  </button>
</div>
