<h2 class="text-3xl sm:text-4xl font-bold text-primary mb-2">Unidades ou glebas</h2>
<p class="text-neutral-secondary text-xl sm:text-2xl mb-6">Unidades ou glebas são parcelas da sua fazenda que podem se estender da 
  mesma propriedade de forma contínua até outras localidades.</p>
<p class="text-neutral-secondary text-xl sm:text-2xl mb-6">Opcional — você pode adicionar depois.</p>

<div class="space-y-4">
  @for (unit of units().controls; track $index; let i = $index) {
    <div [formGroup]="group(i)"
         class="rounded-2xl border-3 border-primary/90 p-5 space-y-3">

      <div class="flex items-center justify-between">
        <span class="text-primary font-semibold">Gleba {{ i + 1 }}</span>
        <button type="button" (click)="removeUnit(i)"
                class="text-3xl text-red-400 hover:text-red-700 transition-colors cursor-pointer">
          <fa-icon [icon]="icons.TRASH" />
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="sm:col-span-2">
          <label [attr.for]="'unit-name-' + i" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Nome *</label>
          <input [id]="'unit-name-' + i" formControlName="name" type="text" placeholder="Ex: Talhão A"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                        bg-transparent text-lg sm:text-xl text-neutral-secondary placeholder:text-neutral-secondary/50
                        focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-area-' + i" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Área (ha) *</label>
          <input [id]="'unit-area-' + i" formControlName="area" type="number" min="0" step="0.01"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                        bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-code-' + i" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">CEP *</label>
          <input [id]="'unit-code-' + i" formControlName="code" type="text"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                        bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-muni-' + i" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Município *</label>
          <input [id]="'unit-muni-' + i" formControlName="municipality" type="text"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                        bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
        </div>

        <div>
          <label [attr.for]="'unit-loc-' + i" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Localidade</label>
          <input [id]="'unit-loc-' + i" formControlName="locationName" type="text"
                 class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                        bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
        </div>

        <div class="sm:col-span-2">
          <app-toggle-field
            label="Zona rural"
            [value]="group(i).value.rural ?? false"
            (toggled)="group(i).get('rural')?.setValue($event)" />
          </div>
      </div>
    </div>
  }

  <button type="button" (click)="addUnit()"
          class="w-full py-3 rounded-xl border-2 border-dashed border-primary/90
                 text-xl sm:text-2xl text-primary font-semibold hover:border-primary
                 flex items-center justify-center gap-2 transition-all duration-300
                 cursor-pointer">
    <fa-icon [icon]="icons.PLUS" />
    Adicionar unidade
  </button>
</div>
