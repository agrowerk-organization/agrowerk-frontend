<h2 class="w-full flex justify-center text-2xl sm:text-3xl font-bold text-primary mb-6">Dados da Propriedade</h2>

<div [formGroup]="form()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">

  <div class="sm:col-span-2">
    <label for="farm-name" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Nome da fazenda *</label>
    <input id="farm-name" formControlName="name" type="text" placeholder="Ex: Fazenda São João"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                  bg-transparent text-lg sm:text-xl text-neutral-secondary placeholder:text-neutral-secondary/50
                  focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="state-reg" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Matrícula Estadual *</label>
    <input id="state-reg" formControlName="stateRegistration" type="text"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                  bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="rural-reg" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Matrícula Rural</label>
    <input id="rural-reg" formControlName="ruralRegistration" type="text"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                  bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
  </div>

  <div>
       <app-select-field
       label="Estado *"
       fieldId="state-id"
       placeholder="Selecione um estado..."
       [options]="stateOptions()"
       formControlName="stateId" />
  </div>

  <div>
    <label for="main-crop" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Cultura principal</label>
    <input id="main-crop" formControlName="mainCrop" type="text" placeholder="Ex: Soja"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                  bg-transparent text-lg sm:text-xl text-neutral-secondary placeholder:text-neutral-secondary/50
                  focus:border-primary outline-none transition-all" />
  </div>

       <app-number-field
              label="Área total (ha) *"
              fieldId="total-area"
              [step]="0.01"
              [min]="0"
              placeholder="0.00"
              formControlName="totalArea" />


       <app-number-field
              label="Área plantada (ha) *"
              fieldId="planted-area"
              [step]="0.01"
              [min]="0"
              placeholder="0.00"
              formControlName="plantedArea" />

     

       <app-number-field
              label="Latitude"
              fieldId="latitude"
              [step]="0.000001"
              placeholder="-7.123456"
              formControlName="latitude" />  
              
       <app-number-field
              label="Longitude *"
              fieldId="longitude"
              [step]="0.000001"
              placeholder="-15.987456"
              formControlName="longitude" />

</div>
