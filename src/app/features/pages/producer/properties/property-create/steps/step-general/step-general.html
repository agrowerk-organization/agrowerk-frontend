<h2 class="text-xl font-bold text-primary mb-6">Dados da Propriedade</h2>

<div [formGroup]="form()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">

  <div class="sm:col-span-2">
    <label for="farm-name" class="text-sm text-neutral-secondary mb-1 block">Nome da fazenda *</label>
    <input id="farm-name" formControlName="name" type="text" placeholder="Ex: Fazenda São João"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary placeholder:text-neutral-secondary/50
                  focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="state-reg" class="text-sm text-neutral-secondary mb-1 block">Matrícula Estadual *</label>
    <input id="state-reg" formControlName="stateRegistration" type="text"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="rural-reg" class="text-sm text-neutral-secondary mb-1 block">Matrícula Rural</label>
    <input id="rural-reg" formControlName="ruralRegistration" type="text"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="state-id" class="text-sm text-neutral-secondary mb-1 block">Estado *</label>
    <select id="state-id" formControlName="stateId"
            class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                   bg-transparent text-primary focus:border-primary outline-none transition-all">
      <option value="" disabled>Selecione...</option>
      @for (state of states(); track state.id) {
        <option [value]="state.id">{{ state.name }}</option>
      }
    </select>
  </div>

  <div>
    <label for="main-crop" class="text-sm text-neutral-secondary mb-1 block">Cultura principal</label>
    <input id="main-crop" formControlName="mainCrop" type="text" placeholder="Ex: Soja"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary placeholder:text-neutral-secondary/50
                  focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="total-area" class="text-sm text-neutral-secondary mb-1 block">Área total (ha) *</label>
    <input id="total-area" formControlName="totalArea" type="number" min="0" step="0.01"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="planted-area" class="text-sm text-neutral-secondary mb-1 block">Área plantada (ha)</label>
    <input id="planted-area" formControlName="plantedArea" type="number" min="0" step="0.01"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="latitude" class="text-sm text-neutral-secondary mb-1 block">Latitude</label>
    <input id="latitude" formControlName="latitude" type="number" step="any"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary focus:border-primary outline-none transition-all" />
  </div>

  <div>
    <label for="longitude" class="text-sm text-neutral-secondary mb-1 block">Longitude</label>
    <input id="longitude" formControlName="longitude" type="number" step="any"
           class="w-full px-4 py-3 rounded-xl border-2 border-primary/40
                  bg-transparent text-primary focus:border-primary outline-none transition-all" />
  </div>

</div>
