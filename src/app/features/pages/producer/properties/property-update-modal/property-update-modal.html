<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(0,0,0,0.6);"
  role="button"
  tabindex="0"
  (click)="doClose.emit()"
  (keydown.escape)="doClose.emit()">

  <div
    class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl
           bg-neutral-primary border-3 border-primary/70
           shadow-2xl shadow-primary/30"
    role="dialog"
    aria-modal="true"
    (click)="onDialogClick($event)"
    (keydown)="$event.stopPropagation()">

    <div
      class="sticky top-0 z-10 flex items-center justify-between p-6 border-b border-primary/30"
      style="background: var(--color-neutral-primary)">
      <div>
        <h2 class="text-xl font-bold text-primary">Editar Propriedade</h2>
        <p class="text-neutral-secondary text-sm">{{ property().name }}</p>
      </div>
      <button
        type="button"
        (click)="doClose.emit()"
        class="flex items-center justify-center w-10 h-10 rounded-xl
               border-2 border-primary/40 text-primary
               hover:border-primary transition-all">
        <fa-icon [icon]="icons.CIRCLE_XMARK" />
      </button>
    </div>

    <div class="flex border-b border-primary/30 px-6">
      @for (tab of tabs; track tab; let i = $index) {
        <button
          type="button"
          (click)="activeTab.set(i)"
          class="px-4 py-3 text-sm font-semibold transition-all duration-300 border-b-2 -mb-px"
          [class.border-primary]="activeTab() === i"
          [class.text-primary]="activeTab() === i"
          [class.border-transparent]="activeTab() !== i"
          [class.text-neutral-secondary]="activeTab() !== i">
          {{ tab }}
        </button>
      }
    </div>

    <div class="p-6">
      @switch (activeTab()) {
        @case (0) { <app-step-general [form]="generalForm" [states]="states()" /> }
        @case (1) { <app-step-address [form]="addressForm" /> }
        @case (2) { <app-step-units   [units]="units" /> }
      }
    </div>

    <div
      class="sticky bottom-0 flex gap-3 p-6 border-t border-primary/30"
      style="background: var(--color-neutral-primary)">
      <button
        type="button"
        (click)="doClose.emit()"
        class="flex-1 py-3 rounded-xl border-2 border-primary/50 text-primary
               font-semibold hover:border-primary transition-all">
        Cancelar
      </button>
      <button
        type="button"
        (click)="submit()"
        [disabled]="loading()"
        class="flex-1 py-3 rounded-xl bg-button-main text-white font-semibold
               hover:bg-button-main-hover transition-all disabled:opacity-40
               flex items-center justify-center gap-2">
        @if (loading()) {
          <fa-icon [icon]="icons.SPINNER" class="animate-spin" />
          Salvando...
        } @else {
          <fa-icon [icon]="icons.CHECK" />
          Salvar alterações
        }
      </button>
    </div>

  </div>
</div>
