<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(0,0,0,0.6);"
  role="button"
  tabindex="0"
  (click)="doClose.emit()"
  (keydown.escape)="doClose.emit()">

  <div
    class="w-full max-w-2xl max-h-[70vh] overflow-y-auto rounded-3xl
           bg-neutral-primary border-3 border-primary/70
           shadow-2xl shadow-primary/30"
    role="dialog"
    aria-modal="true"
    (click)="onDialogClick($event)"
    (keydown)="$event.stopPropagation()">

    <div
      class="sticky top-0 z-10 flex items-center justify-between p-6 border-b border-primary/30"
      style="background: var(--color-neutral-primary)">
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-primary">Editar Propriedade</h2>
        <p class="text-secondary text-lg sm:text-xl">{{ property().name }}</p>
      </div>
      <button
        type="button"
        (click)="doClose.emit()"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-xl
               border-2 border-primary/90 text-primary
               hover:border-primary transition-all
               cursor-pointer">
        <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-xl sm:text-2xl" />
      </button>
    </div>

    <div class="flex border-b border-primary/30 px-6">
      @for (tab of tabs; track tab; let i = $index) {
        <button
          type="button"
          (click)="activeTab.set(i)"
          class="px-4 py-3 text-xl sm:text-2xl font-semibold transition-all duration-300 border-b-4 -mb-px cursor-pointer"
          [class.border-primary]="activeTab() === i"
          [class.text-primary]="activeTab() === i"
          [class.border-transparent]="activeTab() !== i"
          [class.text-neutral-secondary]="activeTab() !== i">
          {{ tab }}
        </button>
      }
    </div>

    <div class="p-6">
      @switch (activeTab()) {
        @case (0) { <app-step-general [form]="generalForm" [states]="states()" [readonly]="true" /> }
        @case (1) { <app-step-address [form]="addressForm" /> }
        @case (2) { <app-step-units   [units]="units" /> }
      }
    </div>

    <div
    class="flex flex-col sm:flex-row justify-center sticky bottom-0 flex gap-3 p-6 border-t border-primary/30"
    style="background: var(--color-neutral-primary)">
  
    <app-button-pages
      text="Cancelar"
      [icon]="icons.CIRCLE_XMARK"
      width="100%"
      (action)="doClose.emit()" />
  
    <app-button-pages
      [text]="loading() ? 'Salvando...' : 'Salvar alterações'"
      [icon]="loading() ? icons.SPINNER : icons.CHECK"
      width="100%"
      [disabled]="loading()"
      (action)="submit()" />
  
  </div>

  </div>
</div>
