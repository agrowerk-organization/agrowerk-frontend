<div class="group relative overflow-hidden rounded-3xl bg-neutral-primary 
            border-3 border-primary/50 hover:border-primary 
            transition-all duration-300 hover:-translate-y-2
            shadow-xl shadow-primary/20 hover:shadow-primary/40 flex flex-col h-full">
    
    <div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative w-full h-86 border-b-3 border-primary/30 overflow-hidden">
      @if (crop().originalUrl) {
        <img [src]="crop().originalUrl" [alt]="crop().name" 
             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
      } @else {
        <div class="w-full h-full bg-gradient-to-br from-emerald-950 to-neutral-primary flex items-center justify-center">
          <fa-icon [icon]="icons.SEEDLING" class="text-7xl text-primary/20" />
        </div>
      }
      <div class="absolute top-4 right-4">
        <span class="px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest 
                     bg-neutral-primary border-2 border-primary text-primary shadow-lg shadow-primary/50">
          {{ categoryLabel() }}
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-4 p-6 flex-1 relative z-10">
      <div>
        <h2 class="text-primary font-black text-2xl uppercase tracking-tight leading-none mb-1">
          {{ crop().name }}
        </h2>
        <p class="text-secondary text-lg italic font-medium border-l-2 border-primary/30 pl-3">
          {{ crop().scientificName }}
        </p>
      </div>

      <div class="grid grid-cols-1 gap-3 mt-2">
        <div class="flex items-center justify-between p-3 rounded-xl bg-black/20 border-2 border-primary/90 shadow-lg shadow-primary/30">
          <div class="flex items-center gap-2">
            <fa-icon [icon]="icons.CLOCK" class="text-primary" />
            <span class="text-lg sm:text-xl font-black uppercase text-secondary tracking-tighter">Ciclo de Crescimento</span>
          </div>
          <span class="text-xl font-bold text-primary">{{ crop().growthCycleDays }} <small class="text-xs">DIAS</small></span>
        </div>
      </div>

      <div class="mt-auto pt-4 border-t-2 border-primary/20 flex justify-end">

        <app-button-pages
          [text]="'Editar'"
          [icon]="icons.PEN"
          [width]="'full'"
          (action)="edit.emit(crop())" />
      </div>
    </div>
</div>
