<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" 
       (click)="toCancel.emit()" 
       (keydown.escape)="toCancel.emit()" 
       tabindex="-1"
       role="presentation"></div>

  <div class="relative z-10 w-full mt-8 max-w-xl max-h-[80vh] flex flex-col rounded-3xl
           bg-neutral-primary border-3 border-primary/70 shadow-2xl shadow-primary/30 overflow-hidden">

    <div class="flex items-center justify-between p-6 border-b border-primary/30 bg-neutral-primary">
      <div>
        <h2 id="modal-title" class="text-xl sm:text-2xl font-black text-primary uppercase tracking-tight">
          {{ cropData() ? 'Editar Cultura' : 'Nova Cultura' }}
        </h2>
        @if (cropData()) {
          <p class="text-secondary/90 text-lg sm:text-xl italic">{{ cropData()!.name }}</p>
        }
      </div>

      <button type="button" (click)="toCancel.emit()" 
              class="w-12 h-12 flex items-center justify-center rounded-xl border-2 border-primary/30 text-primary hover:border-primary transition-all">
        <fa-icon [icon]="icons.CIRCLE_XMARK" class="text-2xl" />
      </button>
    </div>

    <div class="overflow-y-auto flex-1">
      <form id="cropForm" class="p-6 space-y-6" [formGroup]="form" (ngSubmit)="submit()">
        
        <div class="flex flex-col items-center gap-3">
          <div class="relative">
            <div class="w-28 h-28 rounded-3xl ring-4 ring-primary/20 overflow-hidden bg-black/20 border-2 border-primary/50 flex items-center justify-center">
              @if (photoPreview()) {
                <img [src]="photoPreview()" alt="Preview" class="w-full h-full object-cover" />
              } @else {
                <fa-icon [icon]="icons.SEEDLING" class="text-5xl text-primary/20" />
              }
            </div>
            <button type="button" (click)="photoInput.click()"
                    class="absolute -bottom-2 -right-2 w-10 h-10 rounded-2xl bg-primary text-neutral-primary flex items-center justify-center shadow-lg hover:scale-110 transition-all cursor-pointer">
              <fa-icon [icon]="icons.CAMERA" />
            </button>
            <input #photoInput type="file" accept="image/*" class="hidden" (change)="onPhotoChange($event)" />
          </div>
          <p class="text-primary/90 text-xL font-black uppercase tracking-widest">Identidade Visual</p>
        </div>

        <div class="space-y-4">
          <div>
            <label for="crop-name" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Nome da Cultura *</label>
            <input id="crop-name" formControlName="name" type="text" placeholder="Ex: Soja"
                   class="w-full px-4 py-4 rounded-2xl border-2 border-primary/90 
                          bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
          </div>

          <div>
            <label for="scientific-name" class="text-xl sm:text-2xl text-neutral-secondary font-bold mb-1 block">Nome da Cultura *</label>
            <input id="scientific-name" formControlName="scientificName" type="type" placeholder="Ex: Glycine max"
                   class="w-full px-4 py-3 rounded-xl border-2 border-primary/90
                          bg-transparent text-lg sm:text-xl text-neutral-secondary focus:border-primary outline-none transition-all" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-number-field
              label="Ciclo (Dias) *"
              fieldId="growth-days"
              [min]="1"
              formControlName="growthCycleDays" />

            <app-select-field
              label="Categoria *"
              fieldId="crop-cat"
              [options]="categories"
              formControlName="cropCategory" />
          </div>
        </div>
      </form>
    </div>

    <div class="p-6 border-t border-primary/30 bg-neutral-primary flex flex-col sm:flex-row gap-3">
      <app-button-pages
        text="Cancelar"
        [icon]="icons.CIRCLE_XMARK"
        width="100%"
        (action)="toCancel.emit()" />

      <app-button-pages
        [text]="saving() ? 'Salvando...' : (cropData() ? 'Salvar Alterações' : 'Confirmar Criação')"
        [icon]="saving() ? icons.SPINNER : (cropData() ? icons.PEN : icons.PLUS)"
        [disabled]="saving() || form.invalid"
        width="100%"
        (action)="submit()" />
    </div>

  </div>
</div>
